<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>楽天商品検索ブリッジ</title>
<style>
body{font-family:system-ui,sans-serif;max-width:720px;margin:32px auto;padding:0 16px}
pre{white-space:pre-wrap;word-break:break-word;background:#f5f5f5;padding:12px}
</style>
</head>
<body>
<h1>楽天商品検索</h1>
<pre id="result">楽天APIへ接続中...</pre>
<script>
function show(data){
  document.getElementById('result').textContent=JSON.stringify(data,null,2);
}
function fail(error){
  var message=error && error.message ? error.message : String(error || '楽天API通信に失敗しました。');
  show({success:false,error:message});
}
function searchRakuten(){
  google.script.run
    .withSuccessHandler(function(data){
      if(!data){fail('楽天API応答が空です。');return;}
      show(data);
    })
    .withFailureHandler(fail)
    .楽天ブラウザ検索API('フライパン',10);
}
searchRakuten();
</script>
</body>
</html>
