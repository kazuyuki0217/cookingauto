<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>楽天商品検索ブリッジ診断</title>
<style>body{font-family:system-ui,sans-serif;max-width:720px;margin:32px auto;padding:0 16px}pre{white-space:pre-wrap;word-break:break-word;background:#f5f5f5;padding:12px}</style>
</head>
<body>
<h1>楽天商品検索</h1>
<pre id="result">診断① HTML読み込み成功</pre>
<script>
var resultEl=document.getElementById('result');
var startedAt=Date.now();
function show(s){resultEl.textContent=s;}
try{
  show('診断① HTML読み込み成功\n診断② configJson評価開始...');
  var config=JSON.parse(decodeURIComponent('<?!= configJson ?>'));
  show('診断① HTML読み込み成功\n診断② configJson評価成功\n診断③ searchRakuten開始...');
  start();
}catch(e){
  show('診断失敗\n段階: configJson評価\n'+String(e));
}
function start(){
  try{
    if(!config||typeof config!=='object')throw new Error('configJsonがオブジェクトではありません');
    show('診断③ searchRakuten開始\n診断④ 設定値確認...');
    var app=String(config.applicationId||'').trim();
    var key=String(config.accessKey||'').trim();
    var keyword=String(config.keyword||'').trim();
    if(!app||!key||!keyword)throw new Error('設定値不足 applicationId/accessKey/keyword');
    show('診断④ 設定値確認OK\n診断⑤ JSONPコールバック作成...');
    var cb='rakutenBridge_'+Date.now(),done=false;
    window[cb]=function(data){
      if(done)return; done=true;
      if(!data){show('診断失敗\n診断⑥ API応答が空');return;}
      if(data.error){show('診断失敗\n診断⑥ 楽天APIエラー\n'+JSON.stringify(data));return;}
      var items=data.Items||data.items||[];
      show(JSON.stringify({success:true,stage:'rakuten_jsonp',count:Array.isArray(items)?items.length:0,elapsedMs:Date.now()-startedAt}));
    };
    show('診断⑤ JSONPコールバック作成OK\n診断⑥ 外部楽天APIへ接続...');
    var params=new URLSearchParams({
      applicationId:app,accessKey:key,keyword:keyword,hits:String(config.hits||10),
      page:'1',format:'json',formatVersion:'2',sort:'-reviewCount',
      orFlag:'1',availability:'1',imageFlag:'1',callback:cb
    });
    if(String(config.affiliateId||'').trim())params.set('affiliateId',String(config.affiliateId).trim());
    var script=document.createElement('script');
    script.async=true;
    script.onerror=function(){if(!done)show('診断失敗\n診断⑥ JSONPスクリプト読み込みエラー');};
    script.onload=function(){setTimeout(function(){if(!done)show('診断⑥ JSONP読み込み完了・callback未実行');},1500);};
    script.src='https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20260701?'+params.toString();
    document.head.appendChild(script);
    setTimeout(function(){if(!done)show('診断⑥ タイムアウト（20秒）');},20000);
  }catch(e){show('診断失敗\n段階: searchRakuten\n'+String(e));}
}
</script>
</body>
</html>
