<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>楽天商品検索 診断版</title>
<style>
body{font-family:system-ui,sans-serif;max-width:720px;margin:32px auto;padding:0 16px}
input,button{font-size:16px;padding:10px;margin:6px 0;width:100%;box-sizing:border-box}
pre{white-space:pre-wrap;word-break:break-word;background:#f5f5f5;padding:12px}
.note{font-size:14px;color:#555}
.ok{font-weight:700}
</style>
</head>
<body>
<h1>楽天商品検索</h1>
<p>料理自動化用の楽天商品検索です。</p>
<p class="note">楽天APIの通信状態を診断できるテスト版です。アクセスキーは画面から楽天APIへ直接送信し、GASには保存しません。</p>
<label>楽天アクセスキー</label>
<input id="key" type="password" autocomplete="off" placeholder="楽天ウェブサービスのアクセスキー">
<label>検索キーワード</label>
<input id="keyword" value="フライパン" placeholder="検索キーワード">
<button onclick="searchRakuten()">楽天商品を検索</button>
<pre id="result">未実行</pre>
<script>
var callbackName='';
var timeoutId=null;

function cleanup(){
  if(timeoutId){clearTimeout(timeoutId);timeoutId=null;}
  if(callbackName){
    try{delete window[callbackName];}
    catch(e){window[callbackName]=undefined;}
    callbackName='';
  }
  var old=document.getElementById('rakuten-jsonp');
  if(old)old.remove();
}

function show(message){
  document.getElementById('result').textContent=message;
}

function searchRakuten(){
  cleanup();
  var out=document.getElementById('result');
  var key=(document.getElementById('key').value||'').trim();
  var keyword=(document.getElementById('keyword').value||'フライパン').trim()||'フライパン';

  if(!key){
    show('楽天アクセスキーを入力してください。');
    return;
  }

  show('楽天APIへ接続中...\n\n診断開始\n・キーワード: '+keyword+'\n・JSONP方式: 使用\n・APIバージョン: 2026-07-01');

  callbackName='rakutenBridge_'+Date.now();

  window[callbackName]=function(data){
    if(timeoutId){clearTimeout(timeoutId);timeoutId=null;}

    var raw='';
    try{raw=JSON.stringify(data,null,2);}catch(e){raw=String(data);}

    if(!data){
      cleanup();
      show('楽天API応答エラー\n\n応答データが空です。');
      return;
    }

    if(data.error){
      cleanup();
      show('楽天APIがエラーを返しました。\n\nerror: '+(data.error||'')+'\nerror_description: '+(data.error_description||'')+'\n\nAPI応答:\n'+raw);
      return;
    }

    var items=data.Items || data.items;

    if(!items){
      cleanup();
      show('楽天API応答形式エラー\n\nItems/items が見つかりません。\n\nAPI応答:\n'+raw);
      return;
    }

    show('楽天API通信成功\n\n取得件数: '+items.length+'件\n\nGASへ保存中...');

    if(typeof google!=='undefined'&&google.script&&google.script.run){
      google.script.run
        .withSuccessHandler(function(saved){
          cleanup();
          show('楽天API通信成功\n\n取得件数: '+items.length+'件\nGAS保存成功\n\n'+JSON.stringify(saved,null,2));
        })
        .withFailureHandler(function(err){
          cleanup();
          show('楽天API通信成功\n\n取得件数: '+items.length+'件\nGAS保存エラー\n\n'+(err&&err.message?err.message:String(err))+'\n\n楽天API応答:\n'+raw);
        })
        .保存楽天ブラウザ検索結果(JSON.stringify(data));
    }else{
      cleanup();
      show('楽天API通信成功\n\n取得件数: '+items.length+'件\n\nGAS環境ではありません。\n\n'+raw);
    }
  };

  var p=new URLSearchParams({
    applicationId:'5db6e350-5a71-4843-8d29-cf894bef88df',
    accessKey:key,
    affiliateId:'56e8483c.b8c4995b.56e8483d.205a3086',
    keyword:keyword,
    hits:'10',
    page:'1',
    format:'json',
    formatVersion:'2',
    callback:callbackName
  });

  var url='https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20260701?'+p.toString();

  var script=document.createElement('script');
  script.id='rakuten-jsonp';
  script.async=true;

  script.onload=function(){
    out.textContent='楽天APIへリクエスト送信済み。\n\nJSONP応答を待っています...';
  };

  script.onerror=function(event){
    if(timeoutId){clearTimeout(timeoutId);timeoutId=null;}
    var currentCallback=callbackName;
    cleanup();
    show('楽天API通信エラー\n\nscript.onerror が発生しました。\n\n考えられる原因:\n・楽天API側でリクエストが拒否された\n・アクセスキー／アプリIDの認証エラー\n・ブラウザ側で外部スクリプト通信が遮断された\n・API側の一時的な障害\n\nコールバック: '+currentCallback+'\n\n次の段階で、この診断結果をもとに通信方式を切り替えます。');
  };

  document.head.appendChild(script);
  script.src=url;

  timeoutId=setTimeout(function(){
    if(!callbackName)return;
    var currentCallback=callbackName;
    cleanup();
    show('楽天APIタイムアウト\n\n15秒以内にJSONP応答がありませんでした。\n\nコールバック: '+currentCallback+'\n\n楽天公式仕様ではJSONPは対応しています。\nこの結果なら別方式へ切り替えます。');
  },15000);
}
</script>
</body>
</html>
