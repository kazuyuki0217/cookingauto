<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>楽天商品検索ブリッジ</title>
<style>
body{font-family:system-ui,sans-serif;max-width:720px;margin:32px auto;padding:0 16px}
pre{white-space:pre-wrap;word-break:break-word;background:#f5f5f5;padding:12px}
</style>
</head>
<body>
<h1>楽天商品検索</h1>
<pre id="result">楽天API診断を開始しています...</pre>
<script>
var resultEl=document.getElementById('result');
var startedAt=Date.now();
var config;
try{
  config=<?!= configJson ?>;
}catch(e){
  resultEl.textContent='診断: configJson評価失敗\n'+String(e);
  throw e;
}

function showStatus(message){
  resultEl.textContent=message;
}

function fail(message){
  showStatus('楽天API診断失敗\n'+String(message||'不明なエラー'));
}

function searchRakuten(){
  if(!config || typeof config!=='object'){
    fail('configJsonがオブジェクトではありません。');
    return;
  }

  var missing=[];
  if(!String(config.applicationId||'').trim())missing.push('applicationId');
  if(!String(config.accessKey||'').trim())missing.push('accessKey');
  if(!String(config.keyword||'').trim())missing.push('keyword');
  if(missing.length){
    fail('GAS→HTML設定値不足: '+missing.join(', '));
    return;
  }

  var callbackName='rakutenBridge_'+Date.now();
  var finished=false;
  window[callbackName]=function(data){
    if(finished)return;
    finished=true;
    if(!data){fail('楽天API応答が空です。');return;}
    if(data.error){fail((data.error_description||data.error)+'\nHTTP応答は到達しています。');return;}
    var items=data.Items||data.items||[];
    if(!Array.isArray(items)){fail('楽天API応答にItems/itemsがありません。');return;}
    resultEl.textContent=JSON.stringify({
      success:true,
      stage:'rakuten_jsonp',
      count:items.length,
      elapsedMs:Date.now()-startedAt
    });
    try{delete window[callbackName];}catch(e){window[callbackName]=undefined;}
  };

  var params={
    applicationId:String(config.applicationId),
    accessKey:String(config.accessKey),
    keyword:String(config.keyword||'フライパン').trim(),
    hits:String(config.hits||10),
    page:'1',
    format:'json',
    formatVersion:'2',
    sort:'-reviewCount',
    orFlag:'1',
    availability:'1',
    imageFlag:'1',
    callback:callbackName
  };
  if(String(config.affiliateId||'').trim())params.affiliateId=String(config.affiliateId).trim();

  var p=new URLSearchParams(params);
  var script=document.createElement('script');
  script.id='rakuten-jsonp';
  script.async=true;
  script.onerror=function(){fail('楽天API JSONPスクリプト読み込み失敗。GAS→HTMLは正常、外部JSONP到達で停止しています。');};
  script.onload=function(){
    setTimeout(function(){
      if(!finished)fail('JSONP scriptは読み込まれましたがcallbackが実行されませんでした。');
    },1000);
  };
  script.src='https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20260701?'+p.toString();
  showStatus(
    'GAS→HTML設定値: OK\n'+
    'applicationId: OK\n'+
    'accessKey: OK\n'+
    '楽天JSONPへ接続中...'
  );
  document.head.appendChild(script);

  setTimeout(function(){
    if(!finished)fail('楽天APIタイムアウト（20秒）。');
  },20000);
}

searchRakuten();
</script>
</body>
</html>
