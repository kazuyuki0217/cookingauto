<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:sans-serif;max-width:560px;margin:0 auto;padding:20px;line-height:1.6}
h2{margin-bottom:8px}.box{border:1px solid #ddd;border-radius:12px;padding:16px;margin-top:16px}
input,button{width:100%;box-sizing:border-box;font-size:18px;padding:13px;margin-top:8px}
button{cursor:pointer}.note{font-size:14px;color:#666}.ok{margin-top:14px;padding:12px;background:#f3f3f3;border-radius:8px;white-space:pre-wrap}
img{max-width:100%;margin-top:12px;border-radius:10px}
</style>
</head>
<body>
<h2>料理写真コレクション登録</h2>
<p>写真を1枚選び、料理名を入力してください。写真と料理名を同じデータとして自動登録します。</p>
<div class="box">
<label>料理写真</label>
<input id="photo" type="file" accept="image/jpeg,image/png,image/webp">
<img id="preview" style="display:none">
<label>料理名</label>
<input id="dish" type="text" placeholder="例：豚バラ生姜焼き" maxlength="80">
<p class="note">スマホ側で自動的に縮小・圧縮してから送信します。</p>
<button id="send" onclick="register()">登録して自動処理を開始</button>
<div id="result" class="ok" style="display:none"></div>
</div>
<script>
function compress(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const max=1280;
        const scale=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas');
        c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        let q=.78, data;
        do{data=c.toDataURL('image/jpeg',q);q-=.05}while(data.length>1150000&&q>.45);
        resolve(data);
      };
      img.onerror=reject; img.src=e.target.result;
    };
    reader.onerror=reject; reader.readAsDataURL(file);
  });
}
document.getElementById('photo').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f)return;
  const p=document.getElementById('preview'); p.src=URL.createObjectURL(f); p.style.display='block';
});
async function register(){
  const f=document.getElementById('photo').files[0];
  const dish=document.getElementById('dish').value.trim();
  const result=document.getElementById('result');
  const btn=document.getElementById('send');
  if(!f){alert('料理写真を選択してください。');return}
  if(!dish){alert('料理名を入力してください。');return}
  btn.disabled=true; btn.textContent='登録中…'; result.style.display='block'; result.textContent='写真を圧縮しています…';
  try{
    const data=await compress(f);
    result.textContent='写真＋料理名を登録しています…';
    google.script.run.withSuccessHandler(r=>{
      result.textContent='登録成功\n料理名：'+r.dishName+'\n写真：'+r.photoFile+'\nID：'+r.photoId+'\n\n自動処理を開始しました。';
      btn.textContent='登録済み';
    }).withFailureHandler(e=>{
      result.textContent='登録失敗\n'+(e&&e.message?e.message:e);
      btn.disabled=false; btn.textContent='もう一度登録';
    }).料理写真コレクション登録(data,'image/jpeg',f.name,dish);
  }catch(e){
    result.textContent='写真処理失敗\n'+e;
    btn.disabled=false; btn.textContent='もう一度登録';
  }
}
</script>
</body>
</html>
