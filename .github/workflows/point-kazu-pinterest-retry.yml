name: Pointカズ｜Pinterest 5投稿リトライ

on:
  push:
    paths:
      - incoming/pinterest_retry.trigger

permissions:
  actions: read
  contents: read

jobs:
  pinterest_retry:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: 第一段階の成果物を取得
        uses: actions/download-artifact@v4
        with:
          run-id: 35409724602
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: point-kazu-blog-*
          merge-multiple: true

      - name: Pinterest用5パターンを生成
        run: python generate_pinterest_pins.py

      - name: Pinterestへ5件を自動投稿
        env:
          PINTEREST_GAS_URLS: https://script.google.com/macros/s/AKfycbw5WwonV2F6I6FvHHZo3-PqkuPx0BH71qCsz_qkKFcVaiHzTzE80FGpvoEkeJbfQYzAL/exec,https://script.google.com/macros/s/AKfycbx8aKr8B4J2Q_Jv2hFps6Jn8tbZ7EQijylipJEPpMkXO-uu8bLKFuGmc_39izcfVBFs/exec
          PINTEREST_AUTOMATION_SECRET: ${{ secrets.PINTEREST_AUTOMATION_SECRET }}
        run: python publish_pinterest_via_gas.py

      - name: 成功確認
        run: |
          test -s pinterest_publish_result.json
          cat pinterest_publish_result.json