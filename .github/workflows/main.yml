name: はてなブログ自動投稿

on:
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要なライブラリをインストール
        run: pip install -r requirements.txt openai

      - name: AIで記事を作成
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_article.py

      - name: はてなブログへ投稿
        env:
          HATENA_ID: ${{ secrets.HATENA_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
          HATENA_ENDPOINT: ${{ secrets.HATENA_ENDPOINT }}
          POST_TITLE: ${{ steps.article.outputs.title }}
          POST_BODY: ${{ steps.article.outputs.body }}
        run: python post_to_hatena.py
