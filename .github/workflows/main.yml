name: はてなブログ自動投稿

on:
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要なライブラリをインストール
        run: pip install -r requirements.txt

      - name: はてなブログへテスト投稿
        env:
          HATENA_ID: ${{ secrets.HATENA_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
          HATENA_ENDPOINT: ${{ secrets.HATENA_ENDPOINT }}
          POST_TITLE: "自動投稿テスト"
          POST_BODY: "GitHub Actionsからの自動投稿テストです。"
        run: python post_to_hatena.py
