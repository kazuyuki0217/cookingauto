name: 楽天API実ブラウザ接続診断

on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: 楽天API許可ドメイン別ブラウザ診断
        env:
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_APPLICATION_ID: 5db6e350-5a71-4843-8d29-cf894bef88df
          RAKUTEN_AFFILIATE_ID: 56e8483c.b8c4995b.56e8483d.205a3086
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright

          key = os.environ.get('RAKUTEN_ACCESS_KEY', '').strip()
          app_id = os.environ['RAKUTEN_APPLICATION_ID']
          affiliate_id = os.environ['RAKUTEN_AFFILIATE_ID']
          if not key:
              raise RuntimeError('RAKUTEN_ACCESS_KEY がGitHub Secretsにありません')

          page_url = 'https://kazuyuki0217.github.io/cookingauto/rakuten-test/'
          api_url = 'https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20260701?' + urlencode({
              'applicationId': app_id,
              'accessKey': key,
              'affiliateId': affiliate_id,
              'keyword': 'フライパン',
              'hits': 3,
              'page': 1,
              'format': 'json',
              'formatVersion': 2,
          })

          # 楽天管理画面に現在登録されている3候補を、同じブラウザ方式で個別検証する。
          candidates = [
              ('GitHub Pages', 'https://kazuyuki0217.github.io', 'https://kazuyuki0217.github.io/cookingauto/rakuten-test/'),
              ('GAS', 'https://script.google.com', 'https://script.google.com/'),
              ('Hatena', 'https://tansinfuninkazu.hatenablog.com', 'https://tansinfuninkazu.hatenablog.com/'),
          ]

          print('楽天API診断: 許可されたウェブサイト3候補をOrigin/Referer別に実ブラウザ検証します')
          print('API URL:', api_url.replace(key, '***'))

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              for name, origin, referer in candidates:
                  print('\n==========', name, '==========')
                  print('送信Origin:', origin)
                  print('送信Referer:', referer)
                  context = browser.new_context(extra_http_headers={
                      'Origin': origin,
                      'Referer': referer,
                  })
                  page = context.new_page()
                  try:
                      page.goto(page_url, wait_until='domcontentloaded', timeout=30000)
                      response = page.goto(api_url, wait_until='domcontentloaded', timeout=30000)
                      if response:
                          print('楽天API HTTP:', response.status)
                          print('楽天API Content-Type:', response.headers.get('content-type', ''))
                          body = response.text()
                          print('楽天API response body先頭:', body[:1000])
                      else:
                          print('楽天API HTTP: responseなし')
                  except Exception as e:
                      print('楽天API診断エラー:', repr(e))
                  finally:
                      context.close()

              browser.close()

          print('\n========================================')
          print('★★ 許可ドメイン別楽天API診断完了 ★★')
          print('HTTP 200になった候補があれば、そのOrigin/Refererを本番構成に採用します')
          print('========================================')
          PY
