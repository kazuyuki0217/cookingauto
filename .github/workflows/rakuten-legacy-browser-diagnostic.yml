name: 楽天API旧ブラウザ方式再現診断

on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps
      - name: 楽天API旧ブラウザ方式を再現
        env:
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          python - <<'PY'
          import json, os
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright

          key = os.environ.get('RAKUTEN_ACCESS_KEY', '').strip()
          if not key:
              raise RuntimeError('RAKUTEN_ACCESS_KEY がGitHub Secretsにありません')

          api = 'https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20260701'
          params = {
              'applicationId': '5db6e350-5a71-4848-3d29-cf894bef88df',
              'accessKey': key,
              'affiliateId': '56e8483c.b8c4995b.56a8483d.205a3086',
              'keyword': 'フライパン',
              'hits': '3',
              'page': '1',
              'format': 'json',
              'formatVersion': '2',
          }
          url = api + '?' + urlencode(params)
          origin = 'https://tansinfuninkazu.hatenablog.com/'

          print('楽天API旧方式診断: Hatenaページを開きます')
          print('楽天API旧方式診断: APIへブラウザfetchします')

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(extra_http_headers={
                  'Referer': origin,
                  'Accept': 'application/json',
              })
              page.goto(origin, wait_until='domcontentloaded', timeout=30000)

              result = page.evaluate('''async ({url, referer}) => {
                  const r = await fetch(url, {
                      method: 'GET',
                      headers: {
                          'Accept': 'application/json',
                          'Referer': referer
                      }
                  });
                  return {
                      status: r.status,
                      contentType: r.headers.get('content-type') || '',
                      url: r.url,
                      text: await r.text()
                  };
              }''', {'url': url, 'referer': origin})

              print('楽天API HTTP:', result['status'])
              print('楽天API Content-Type:', result['contentType'])
              print('楽天API URL:', result['url'])
              if result['status'] < 200 or result['status'] >= 300:
                  print('楽天APIエラー本文:', result['text'][:2000])
                  raise RuntimeError(f"楽天API HTTPエラー: {result['status']}")
              try:
                  data = json.loads(result['text'])
              except Exception:
                  print('楽天API本文:', result['text'][:2000])
                  raise RuntimeError('楽天API応答がJSONではありません')

              items = data.get('items', [])
              print('楽天API商品件数:', len(items))
              for i, item in enumerate(items[:3], 1):
                  print(f"商品{i}: {item.get('itemName','')}")
                  print(f"価格{i}: {item.get('itemPrice','')}")
                  print(f"affiliateUrl{i}: {'あり' if item.get('affiliateUrl') else 'なし'}")

              if not items:
                  raise RuntimeError('楽天APIは200ですが商品が0件です')
              if not any(item.get('affiliateUrl') for item in items):
                  raise RuntimeError('楽天APIは商品を返しましたがaffiliateUrlがありません')
              print('楽天API旧ブラウザ方式: 接続成功・affiliateUrl取得成功')
              browser.close()
          PY
