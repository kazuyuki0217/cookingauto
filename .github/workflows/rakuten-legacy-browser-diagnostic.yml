name: 楽天API旧ブラウザ方式再現診断

on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install HTTP client
        run: python -m pip install --upgrade pip requests
      - name: 楽天API許可ドメイン比較診断
        env:
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests
          from urllib.parse import urlencode

          key = os.environ.get('RAKUTEN_ACCESS_KEY', '').strip()
          if not key:
              raise RuntimeError('RAKUTEN_ACCESS_KEY がGitHub Secretsにありません')

          api = 'https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20260701'
          params = {
              'applicationId': '5db6e350-5a71-4848-3d29-cf894bef88df',
              'accessKey': key,
              'affiliateId': '56e8483c.b8c4995b.56a8483d.205a3086',
              'keyword': 'フライパン',
              'hits': '3',
              'page': '1',
              'format': 'json',
              'formatVersion': '2',
          }
          url = api + '?' + urlencode(params)

          candidates = [
              ('Hatena', 'https://tansinfuninkazu.hatenablog.com', 'https://tansinfuninkazu.hatenablog.com/'),
              ('Google Apps Script', 'https://script.google.com', 'https://script.google.com/'),
              ('GitHub Pages', 'https://kazuyuki0217.github.io', 'https://kazuyuki0217.github.io/'),
          ]

          success = False
          for name, origin, referer in candidates:
              print('--- 楽天API診断:', name, '---')
              print('Origin:', origin)
              print('Referer:', referer)
              headers = {
                  'Origin': origin,
                  'Referer': referer,
                  'User-Agent': 'Mozilla/5.0 (compatible; cookingauto/1.0)',
                  'Accept': 'application/json',
              }
              response = requests.get(url, headers=headers, timeout=30, allow_redirects=False)
              print('HTTP:', response.status_code)
              print('Content-Type:', response.headers.get('content-type', ''))
              text = response.text
              print('本文:', text[:1000])
              if 200 <= response.status_code < 300:
                  try:
                      data = response.json()
                      items = data.get('items', [])
                      print('商品件数:', len(items))
                      print('affiliateUrl:', 'あり' if any(item.get('affiliateUrl') for item in items) else 'なし')
                      if items and any(item.get('affiliateUrl') for item in items):
                          success = True
                          print('★★ 成功した許可ドメイン:', name, '★★')
                          break
                  except Exception as e:
                      print('JSON解析エラー:', e)

          if not success:
              raise RuntimeError('3つの登録候補ドメインすべてで楽天API接続に成功しませんでした')
          PY
