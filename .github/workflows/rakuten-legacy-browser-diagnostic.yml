name: 楽天API旧ブラウザ方式再現診断

on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install HTTP client
        run: python -m pip install --upgrade pip requests
      - name: 楽天API Referer直接送信診断
        env:
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import requests
          from urllib.parse import urlencode

          key = os.environ.get('RAKUTEN_ACCESS_KEY', '').strip()
          if not key:
              raise RuntimeError('RAKUTEN_ACCESS_KEY がGitHub Secretsにありません')

          api = 'https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20260701'
          params = {
              'applicationId': '5db6e350-5a71-4848-3d29-cf894bef88df',
              'accessKey': key,
              'affiliateId': '56e8483c.b8c4995b.56a8483d.205a3086',
              'keyword': 'フライパン',
              'hits': '3',
              'page': '1',
              'format': 'json',
              'formatVersion': '2',
          }
          url = api + '?' + urlencode(params)
          referer = 'https://tansinfuninkazu.hatenablog.com/'

          print('楽天API診断: HTTPSリクエストを開始します')
          print('楽天API診断: Referer:', referer)

          headers = {
              'Referer': referer,
              'User-Agent': 'Mozilla/5.0 (compatible; cookingauto/1.0)',
              'Accept': 'application/json',
          }

          response = requests.get(url, headers=headers, timeout=30, allow_redirects=False)
          print('楽天API HTTP:', response.status_code)
          print('楽天API Content-Type:', response.headers.get('content-type', ''))
          print('楽天API URL:', response.url)
          print('楽天API Location:', response.headers.get('location', 'なし'))

          text = response.text
          if response.status_code < 200 or response.status_code >= 300:
              print('楽天APIエラー本文:', text[:2000])
              raise RuntimeError(f'楽天API HTTPエラー: {response.status_code}')

          try:
              data = response.json()
          except Exception:
              print('楽天API本文:', text[:2000])
              raise RuntimeError('楽天API応答がJSONではありません')

          items = data.get('items', [])
          print('楽天API商品件数:', len(items))
          for i, item in enumerate(items[:3], 1):
              print(f"商品{i}: {item.get('itemName','')}")
              print(f"価格{i}: {item.get('itemPrice','')}")
              print(f"affiliateUrl{i}: {'あり' if item.get('affiliateUrl') else 'なし'}")

          if not items:
              raise RuntimeError('楽天APIは200ですが商品が0件です')
          if not any(item.get('affiliateUrl') for item in items):
              raise RuntimeError('楽天APIは商品を返しましたがaffiliateUrlがありません')

          print('楽天API: 接続成功・商品取得成功・affiliateUrl取得成功')
          PY
