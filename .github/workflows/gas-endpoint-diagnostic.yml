name: GAS Endpoint Diagnostic
on:
  push:
    paths:
      - '.github/workflows/gas-endpoint-diagnostic.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test new GAS Web App POST with redirect preservation
        env:
          GAS_URL: https://script.google.com/macros/s/AKfycbyO9KgF5iFOVwbfrkcqZzk5atwQTwkwjmKDtram8yecM2xfxjOGhWxpfUonnctUbx9M/exec
          SECRET: ${{ secrets.PINTEREST_AUTOMATION_SECRET }}
        run: |
          set +e
          echo '=== GET ==='
          curl -sS -L -o /tmp/get.txt -w 'HTTP=%{http_code}\nFINAL_URL=%{url_effective}\nTYPE=%{content_type}\n' "$GAS_URL"
          echo 'BODY_HEAD:'
          head -c 300 /tmp/get.txt | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g'
          echo
          echo '=== POST rakuten_key (preserve POST across redirects) ==='
          curl -sS -L --post301 --post302 --post303 -X POST -H 'Content-Type: application/json' --data "{\"service\":\"rakuten_key\",\"secret\":\"$SECRET\"}" -o /tmp/post.txt -w 'HTTP=%{http_code}\nFINAL_URL=%{url_effective}\nTYPE=%{content_type}\n' "$GAS_URL"
          echo 'BODY_HEAD:'
          head -c 600 /tmp/post.txt | sed -E 's/[A-Za-z0-9_-]{20,}/[REDACTED]/g' | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g'
          echo
