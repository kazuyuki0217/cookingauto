# Production Rakuten search connection diagnostic
name: 楽天API本番検索実接続診断
on:
  push:
    paths:
      - '.github/workflows/rakuten-bridge-live-diagnostic.yml'
      - 'rakuten_browser_search.py'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: 本番検索モジュールを実行
        env:
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          set -e
          python -m pip install requests playwright
          python - <<'PY'
          import json
          from rakuten_browser_search import search_rakuten_browser

          items = search_rakuten_browser('フライパン', hits=3)
          print('=== PRODUCTION_RAKUTEN_SEARCH ===')
          print('ITEM_COUNT=' + str(len(items)))
          print('ITEMS=' + json.dumps([
              {
                  'name': x.get('itemName'),
                  'price': x.get('itemPrice'),
                  'affiliateUrlPresent': bool(x.get('affiliateUrl')),
                  'itemUrlPresent': bool(x.get('itemUrl')),
              } for x in items[:3]
          ], ensure_ascii=False))
          if not items:
              raise RuntimeError('本番検索で商品0件')
          if not any('フライパン' in str(x.get('itemName','')) for x in items):
              raise RuntimeError('本番検索はHTTP接続できたがフライパン商品が返っていません')
          if not any(x.get('affiliateUrl') for x in items):
              raise RuntimeError('本番検索でaffiliateUrlが取得できていません')
          print('RAKUTEN_PRODUCTION_CONNECTION_VERIFIED=' + json.dumps({'count':len(items),'first':items[0].get('itemName')},ensure_ascii=False))
          PY
