# 登録済みHatenaブログを実ブラウザ起点にして楽天APIの許可判定を実測
name: 楽天ブラウザブリッジ実接続診断
on:
  push:
    paths:
      - '.github/workflows/rakuten-bridge-live-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Playwrightで楽天API実接続を診断
        env:
          GAS_URL: https://script.google.com/macros/s/AKfycbyO9KgF5iFOVwbfrcQZzk5atwQTwkwjmKDtram8yecM2xfxjOGhWxpfUonnctUbx9M/exec
          HATENA_URL: https://tansinfuninkazu.hatenablog.com/
          SECRET: ${{ secrets.PINTEREST_AUTOMATION_SECRET }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          set -e
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          cat > /tmp/diag.py <<'PY'
          import json, os
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright

          gas = os.environ['GAS_URL']
          hatena = os.environ['HATENA_URL']
          secret = os.environ['SECRET']
          access_key = os.environ['RAKUTEN_ACCESS_KEY']
          keyword = 'フライパン'
          api_base = 'https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20260701'

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)

              # GAS接続確認
              gas_context = browser.new_context(extra_http_headers={'Origin':hatena,'Referer':hatena})
              gas_page = gas_context.new_page()
              gas_url = gas + '?' + urlencode({'service':'rakuten_browser','secret':secret,'keyword':keyword,'hits':'3'})
              gas_response = gas_page.goto(gas_url, wait_until='domcontentloaded', timeout=60000)
              print('GAS_CONNECTION=' + json.dumps({'http':gas_response.status if gas_response else None,'title':gas_page.title()}, ensure_ascii=False))
              gas_context.close()

              # 実際の登録済みHatenaページからscriptタグで楽天APIを呼ぶ
              context = browser.new_context()
              page = context.new_page()
              events = {'console':[], 'pageerror':[], 'requestfailed':[], 'responses':[]}
              page.on('console', lambda m: events['console'].append(m.text[:500]))
              page.on('pageerror', lambda e: events['pageerror'].append(str(e)[:1000]))
              page.on('requestfailed', lambda r: events['requestfailed'].append({'url':r.url[:500], 'failure':str(r.failure)[:500]}))
              page.on('response', lambda r: events['responses'].append({'url':r.url[:500],'status':r.status,'content_type':r.headers.get('content-type')}) if api_base in r.url else None)
              print('=== TEST REAL_HATENA_ORIGIN ===')
              response = page.goto(hatena, wait_until='domcontentloaded', timeout=60000)
              print('HATENA_CONNECTION=' + json.dumps({'http':response.status if response else None,'url':page.url,'title':page.title()}, ensure_ascii=False))
              result = page.evaluate("""({accessKey, keyword, apiBase}) => new Promise(resolve => {
                const cb='rakutenReal_'+Date.now();
                window[cb]=data=>resolve({kind:'callback',data});
                const p=new URLSearchParams({applicationId:'5db6e350-5a71-4843-8d29-cf894bef88df',accessKey,affiliateId:'56e8483c.b8c4995b.56e8483d.205a3086',keyword,hits:'3',page:'1',format:'json',formatVersion:'2',callback:cb});
                const s=document.createElement('script');
                s.src=apiBase+'?'+p.toString();
                s.onerror=()=>resolve({kind:'error'});
                document.head.appendChild(s);
                setTimeout(()=>resolve({kind:'timeout'}),20000);
              })""", {'accessKey':access_key,'keyword':keyword,'apiBase':api_base})
              print('HATENA_API_RESULT=' + json.dumps(result, ensure_ascii=False)[:8000])
              print('EVENTS=' + json.dumps(events, ensure_ascii=False)[:10000])
              context.close()
              browser.close()

              if result.get('kind') != 'callback':
                  raise RuntimeError('Hatena実ページ起点でも楽天API商品応答を取得できませんでした: ' + json.dumps(result, ensure_ascii=False))
              data = result.get('data') or {}
              items = data.get('items') or data.get('Items') or []
              if not items:
                  raise RuntimeError('楽天APIは応答したが商品0件: ' + json.dumps(data, ensure_ascii=False)[:5000])
              print('RAKUTEN_CONNECTION_VERIFIED=' + json.dumps({'http':'200','product_count':len(items),'route':'Hatena real page -> Rakuten JSONP'}, ensure_ascii=False))
          PY
          python /tmp/diag.py
