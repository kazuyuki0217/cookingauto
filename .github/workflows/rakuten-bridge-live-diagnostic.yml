# Rakuten API browser-origin diagnostic: explicit navigation referer
name: 楽天ブラウザブリッジ実接続診断
on:
  push:
    paths:
      - '.github/workflows/rakuten-bridge-live-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Playwrightで楽天API JSONP実接続を診断
        env:
          HATENA_URL: https://tansinfuninkazu.hatenablog.com/
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          set -e
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          cat > /tmp/diag.py <<'PY'
          import json, os, re
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright

          hatena = os.environ['HATENA_URL']
          access_key = os.environ['RAKUTEN_ACCESS_KEY']
          api = 'https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20260701'
          params = {
              'applicationId':'5db6e350-5a71-4843-8dcf-894bef88df',
              'accessKey':access_key,
              'affiliateId':'56e8483c.b8c4995b.56e8483d.205a3086',
              'keyword':'フライパン',
              'hits':'3',
              'page':'1',
              'format':'json',
              'formatVersion':'2',
              'sort':'-reviewCount',
              'orFlag':'1',
              'availability':'1',
              'imageFlag':'1'
          }
          api_url = api + '?' + urlencode(params) + '&callback=rakutenDiagnosticCallback'

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context()
              page = context.new_page()
              request_info = {}

              def on_request(request):
                  if '/IchibaItem/Search/' in request.url:
                      request_info['referer'] = request.headers.get('referer')

              page.on('request', on_request)
              print('=== TEST_REAL_HATENA_TO_RAKUTEN_TOP_LEVEL_NAVIGATION_EXPLICIT_REFERER ===')
              page.goto(hatena, wait_until='domcontentloaded', timeout=60000)
              response = page.goto(api_url, referer=hatena, wait_until='domcontentloaded', timeout=60000)

              status = response.status if response else None
              content_type = response.headers.get('content-type') if response else None
              body = response.text() if response else ''
              print('RAKUTEN_HTTP_STATUS=' + str(status))
              print('RAKUTEN_CONTENT_TYPE=' + str(content_type))
              print('RAKUTEN_REFERER_PRESENT=' + str(bool(request_info.get('referer'))))
              print('RAKUTEN_REFERER_IS_HATENA=' + str(request_info.get('referer') == hatena))
              print('RAKUTEN_BODY_HEAD=' + body[:1500])

              page.close(); context.close(); browser.close()

          if status != 200:
              raise RuntimeError('楽天APIブラウザ実接続 HTTPエラー: ' + str(status) + ' ' + body[:1000])

          match = re.search(r'rakutenDiagnosticCallback\((.*)\)\s*;?\s*$', body, re.S)
          if not match:
              raise RuntimeError('楽天API JSONP応答形式を確認できませんでした: ' + body[:1000])
          data = json.loads(match.group(1))
          items = data.get('items') or data.get('Items') or []
          if not items:
              raise RuntimeError('楽天APIは200だが商品0件: ' + json.dumps(data, ensure_ascii=False)[:5000])
          print('RAKUTEN_CONNECTION_VERIFIED=' + json.dumps({'http':'200','product_count':len(items),'first_product_name':items[0].get('itemName') if isinstance(items[0],dict) else None}, ensure_ascii=False))
          PY
          python /tmp/diag.py
