# Rakuten API browser-origin diagnostic: no-cors fetch from registered GitHub Pages origin
name: 楽天ブラウザブリッジ実接続診断
on:
  push:
    paths:
      - '.github/workflows/rakuten-bridge-live-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Playwrightで楽天API実接続を診断
        env:
          HATENA_URL: https://kazuyuki0217.github.io/cookingauto/rakuten-test/
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          set -e
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          cat > /tmp/diag.py <<'PY'
          import json, os
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright

          page_url = os.environ['HATENA_URL']
          access_key = os.environ['RAKUTEN_ACCESS_KEY']
          api = 'https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20260701'
          params = {
              'applicationId':'5db6e350-5a71-4843-8dcf-894bef88df',
              'accessKey':access_key,
              'affiliateId':'56e8483c.b8c4995b.56e8483d.205a3086',
              'keyword':'フライパン',
              'hits':'3',
              'page':'1',
              'format':'json',
              'formatVersion':'2',
              'sort':'-reviewCount',
              'orFlag':'1',
              'availability':'1',
              'imageFlag':'1'
          }
          api_url = api + '?' + urlencode(params)

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context()
              page = context.new_page()
              captured = {}

              def on_request(r):
                  if '/IchibaItem/Search/' not in r.url:
                      return
                  captured['request_headers'] = {k:v for k,v in r.headers.items() if k.lower() in ('referer','origin','sec-fetch-dest','sec-fetch-mode','sec-fetch-site')}

              def on_response(r):
                  if '/IchibaItem/Search/' not in r.url:
                      return
                  captured['status'] = r.status
                  captured['content_type'] = r.headers.get('content-type')
                  try:
                      captured['body'] = r.body().decode('utf-8', errors='replace')
                  except Exception as e:
                      captured['body_error'] = str(e)

              def on_failed(r):
                  if '/IchibaItem/Search/' in r.url:
                      captured['failed'] = r.failure

              page.on('request', on_request)
              page.on('response', on_response)
              page.on('requestfailed', on_failed)
              page.goto(page_url, wait_until='domcontentloaded', timeout=60000)
              page.set_extra_http_headers({'Origin': 'https://kazuyuki0217.github.io', 'Referer': page_url})
              page.evaluate("""(url) => {
                window.rakutenDiag = {done:false, error:null, status:null, type:null, body:null};
                fetch(url, {method:'GET', mode:'no-cors', credentials:'omit', cache:'no-store'})
                  .then(r => {
                    window.rakutenDiag.status = r.status;
                    window.rakutenDiag.type = r.type;
                    return r.text().then(t => { window.rakutenDiag.body = t; window.rakutenDiag.done = true; });
                  })
                  .catch(e => { window.rakutenDiag.error = String(e); window.rakutenDiag.done = true; });
              }""", api_url)
              page.wait_for_timeout(10000)
              js_diag = page.evaluate('window.rakutenDiag')
              print('=== TEST_GITHUB_PAGES_BROWSER_NO_CORS ===')
              print('PAGE_URL=' + page.url)
              print('JS_DIAG=' + json.dumps(js_diag, ensure_ascii=False))
              print('NETWORK_STATUS=' + str(captured.get('status')))
              print('NETWORK_CONTENT_TYPE=' + str(captured.get('content_type')))
              print('NETWORK_FAILURE=' + str(captured.get('failed')))
              print('NETWORK_REQUEST_HEADERS=' + json.dumps(captured.get('request_headers',{}), ensure_ascii=False))
              print('NETWORK_BODY_HEAD=' + captured.get('body','')[:3000])
              page.close(); context.close(); browser.close()

          status = captured.get('status')
          body = captured.get('body','')
          if status != 200:
              raise RuntimeError('楽天API GitHub Pages no-cors実接続失敗: ' + json.dumps({'http':status,'failure':captured.get('failed'),'request_headers':captured.get('request_headers',{}),'js_diag':js_diag,'body_head':body[:1000]}, ensure_ascii=False))
          try:
              data = json.loads(body)
          except Exception as e:
              raise RuntimeError('楽天API HTTP 200だがJSON解析失敗: ' + str(e) + ' body=' + body[:2000])
          items = data.get('items') or data.get('Items') or []
          if not items:
              raise RuntimeError('楽天API HTTP 200だがフライパン商品0件: ' + json.dumps(data, ensure_ascii=False)[:4000])
          print('RAKUTEN_CONNECTION_VERIFIED=' + json.dumps({'http':status, 'product_count':len(items), 'first_product_name':items[0].get('itemName') if isinstance(items[0],dict) else None}, ensure_ascii=False))
          PY
          python /tmp/diag.py
