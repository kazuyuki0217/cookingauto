# GitHub Pages実ブラウザ起点＋route.fetchにRefererだけを明示
name: 楽天ブラウザブリッジ実接続診断
on:
  push:
    paths:
      - '.github/workflows/rakuten-bridge-live-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Playwrightで楽天API実接続を診断
        env:
          GAS_URL: https://script.google.com/macros/s/AKfycbyO9KgF5iFOVwbfrcQZzk5atwQTwkwjmKDtram8yecM2xfxjOGhWxpfUonnctUbx9M/exec
          GITHUB_PAGES_URL: https://kazuyuki0217.github.io/cookingauto/rakuten-test/
          SECRET: ${{ secrets.PINTEREST_AUTOMATION_SECRET }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          set -e
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          cat > /tmp/diag.py <<'PY'
          import json, os
          from urllib.parse import urlencode, urlparse, parse_qsl
          from playwright.sync_api import sync_playwright

          gas = os.environ['GAS_URL']
          pages = os.environ['GITHUB_PAGES_URL']
          secret = os.environ['SECRET']
          access_key = os.environ['RAKUTEN_ACCESS_KEY']
          keyword = 'フライパン'
          api_marker = 'openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/'

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              gas_context = browser.new_context(extra_http_headers={'Origin':'https://tansinfuninkazu.hatenablog.com','Referer':'https://tansinfuninkazu.hatenablog.com/'})
              gas_page = gas_context.new_page()
              gas_url = gas + '?' + urlencode({'service':'rakuten_browser','secret':secret,'keyword':keyword,'hits':'3'})
              gas_response = gas_page.goto(gas_url, wait_until='domcontentloaded', timeout=60000)
              print('GAS_CONNECTION=' + json.dumps({'http':gas_response.status if gas_response else None,'title':gas_page.title()}, ensure_ascii=False))
              gas_context.close()

              context = browser.new_context()
              page = context.new_page()
              page.add_init_script('window.__RAKUTEN_AUTOMATION_KEY = ' + json.dumps(access_key) + ';')
              events = {'console':[], 'pageerror':[], 'requestfailed':[], 'responses':[]}
              page.on('console', lambda m: events['console'].append(m.text[:500]))
              page.on('pageerror', lambda e: events['pageerror'].append(str(e)[:1000]))
              page.on('requestfailed', lambda r: events['requestfailed'].append({'url':r.url[:500], 'failure':str(r.failure)[:500]}))

              def route_handler(route):
                  try:
                      upstream = route.fetch(timeout=60000, headers={'Referer':pages})
                      raw = upstream.body()
                      text = raw.decode('utf-8', errors='replace').lstrip('\ufeff \r\n\t')
                      qs = dict(parse_qsl(urlparse(route.request.url).query))
                      print('RAKUTEN_UPSTREAM=' + json.dumps({'status':upstream.status,'content_type':upstream.headers.get('content-type'),'body_head':text[:5000]}, ensure_ascii=False))
                      body = raw
                      callback = str(qs.get('callback','')).strip()
                      if callback:
                          try:
                              parsed = json.loads(text)
                              body = (callback + '(' + json.dumps(parsed, ensure_ascii=False, separators=(',', ':')) + ');').encode('utf-8')
                              print('RAKUTEN_JSON_TO_JSONP=wrapped')
                          except json.JSONDecodeError:
                              print('RAKUTEN_JSON_TO_JSONP=already_jsonp_or_nonjson')
                      route.fulfill(status=upstream.status, body=body, headers={'Content-Type':'application/javascript; charset=utf-8'})
                  except Exception as e:
                      print('ROUTE_FETCH_ERROR=' + str(e)[:2000])
                      route.abort()

              page.route('**/IchibaItem/Search/**', route_handler)
              page.on('response', lambda r: events['responses'].append({'url':r.url[:500],'status':r.status,'content_type':r.headers.get('content-type')}) if api_marker in r.url else None)

              print('=== TEST GITHUB_PAGES_ROUTE_REFERER_ONLY ===')
              response = page.goto(pages + '?' + urlencode({'keyword':keyword,'hits':'3'}), wait_until='domcontentloaded', timeout=60000)
              print('PAGES_CONNECTION=' + json.dumps({'http':response.status if response else None,'url':page.url,'title':page.title()}, ensure_ascii=False))
              try:
                  page.wait_for_function("document.querySelector('#result') && document.querySelector('#result').textContent !== '実行中...'", timeout=30000)
              except Exception as e:
                  print('WAIT_ERROR=' + str(e)[:500])
              result_text = page.locator('#result').inner_text() if page.locator('#result').count() else ''
              print('PAGES_RESULT=' + result_text[:5000])
              print('EVENTS=' + json.dumps(events, ensure_ascii=False)[:10000])
              context.close()
              browser.close()

              if '楽天API接続成功' not in result_text:
                  raise RuntimeError('GitHub Pages経路で楽天API商品取得を確認できませんでした: ' + result_text[:3000])
              print('RAKUTEN_CONNECTION_VERIFIED=' + json.dumps({'http':'200','product_count':'>=1','route':'GitHub Pages -> route.fetch(Referer) -> JSONP'}, ensure_ascii=False))
          PY
          python /tmp/diag.py
