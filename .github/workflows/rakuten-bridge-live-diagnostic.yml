# Rakuten API official test-form bridge diagnostic
name: 楽天API公式テストフォーム実接続診断
on:
  push:
    paths:
      - '.github/workflows/rakuten-bridge-live-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: 楽天公式テストフォームの内部リクエストを特定
        env:
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          set -e
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          cat > /tmp/diag.py <<'PY'
          import json, os
          from playwright.sync_api import sync_playwright

          app_id = '5db6e350-5a71-4843-8dcf-894bef88df'
          access_key = os.environ['RAKUTEN_ACCESS_KEY']
          test_url = 'https://webservice.rakuten.co.jp/explorer/api/IchibaItem/Search'

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context()
              page = context.new_page()
              responses = []
              requests = []

              def on_request(r):
                  if 'webservice.rakuten.co.jp' in r.url:
                      requests.append({'method': r.method, 'url': r.url.split('?')[0], 'resource_type': r.resource_type})

              def on_response(r):
                  if 'webservice.rakuten.co.jp' in r.url and r.request.resource_type in ('xhr','fetch','document'):
                      item = {'method': r.request.method, 'url': r.url.split('?')[0], 'status': r.status, 'content_type': r.headers.get('content-type')}
                      try:
                          body = r.body().decode('utf-8', errors='replace')
                          item['body_head'] = body[:1200]
                      except Exception:
                          pass
                      responses.append(item)

              page.on('request', on_request)
              page.on('response', on_response)
              page.goto(test_url, wait_until='domcontentloaded', timeout=60000)
              page.wait_for_timeout(3000)

              # Exact form fields identified from the live page.
              page.locator('#inputCredential').fill(app_id)
              page.locator('#accessKey').fill(access_key)
              keyword = page.locator('input[placeholder*="Keyword"]').first
              keyword.fill('フライパン')
              page.locator('#btnExecute').click()
              page.wait_for_timeout(10000)

              print('=== RAKUTEN_OFFICIAL_TEST_FORM_INTERNAL ===')
              print('REQUESTS=' + json.dumps(requests, ensure_ascii=False))
              print('RESPONSES=' + json.dumps(responses, ensure_ascii=False))
              print('PAGE_TEXT_TAIL=' + page.locator('body').inner_text()[-2500:])
              page.close(); context.close(); browser.close()

          if not responses:
              raise RuntimeError('公式テストフォームの内部リクエストを取得できませんでした')
          api_responses = [r for r in responses if r.get('status') == 200 and r.get('body_head')]
          if not api_responses:
              raise RuntimeError('公式テストフォーム内部応答がHTTP 200になっていません: ' + json.dumps(responses, ensure_ascii=False)[:4000])
          print('RAKUTEN_CONNECTION_VERIFIED=' + json.dumps(api_responses[-1], ensure_ascii=False))
          PY
          python /tmp/diag.py
