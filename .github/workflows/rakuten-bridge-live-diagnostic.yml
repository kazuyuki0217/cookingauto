# Rakuten API official test-form proxy diagnostic
name: 楽天API公式テストフォーム実接続診断
on:
  push:
    paths:
      - '.github/workflows/rakuten-bridge-live-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: 楽天公式プロキシを直接検証
        env:
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          set -e
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          cat > /tmp/diag.py <<'PY'
          import json, os
          from playwright.sync_api import sync_playwright

          app_id = '5db6e350-5a71-4843-8dcf-894bef88df'
          access_key = os.environ['RAKUTEN_ACCESS_KEY']
          test_url = 'https://webservice.rakuten.co.jp/explorer/api/IchibaItem/Search'

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context()
              page = context.new_page()
              page.goto(test_url, wait_until='domcontentloaded', timeout=60000)
              page.wait_for_timeout(2000)

              params = {
                  'format':'json',
                  'formatVersion':'2',
                  'keyword':'フライパン',
                  'applicationId':app_id,
                  'accessKey':access_key,
                  'affiliateId':'56e8483c.b8c4995b.56e8483d.205a3086',
                  'hits':'3',
                  'page':'1',
                  'sort':'-reviewCount',
                  'orFlag':'1',
                  'availability':'1',
                  'imageFlag':'1'
              }

              result = page.evaluate("""async (params) => {
                  const qs = new URLSearchParams(params).toString();
                  const r = await fetch('/explorer/proxy?' + qs, {method:'GET', credentials:'same-origin', cache:'no-store'});
                  const text = await r.text();
                  return {status:r.status, contentType:r.headers.get('content-type'), text:text.slice(0,8000)};
              }""", params)

              print('=== RAKUTEN_OFFICIAL_PROXY_DIRECT ===')
              print('HTTP=' + str(result.get('status')))
              print('CONTENT_TYPE=' + str(result.get('contentType')))
              print('BODY_HEAD=' + result.get('text','')[:5000])

              text = result.get('text','')
              try:
                  outer = json.loads(text)
                  inner_text = outer.get('content','') if isinstance(outer, dict) else ''
                  inner = json.loads(inner_text) if inner_text else {}
                  items = inner.get('Items') or inner.get('items') or []
                  normalized = []
                  for x in items[:3]:
                      item = x.get('Item') if isinstance(x, dict) and isinstance(x.get('Item'), dict) else x
                      if isinstance(item, dict):
                          normalized.append({'name':item.get('itemName'),'price':item.get('itemPrice'),'itemUrl':item.get('itemUrl'),'affiliateUrl':item.get('affiliateUrl')})
                  print('NORMALIZED=' + json.dumps({'count':inner.get('count'),'items':normalized}, ensure_ascii=False))
                  if result.get('status') != 200 or not normalized:
                      raise RuntimeError('公式プロキシはHTTP 200だが商品取得失敗')
                  print('RAKUTEN_CONNECTION_VERIFIED=' + json.dumps({'http':result.get('status'),'count':inner.get('count'),'first_product':normalized[0]}, ensure_ascii=False))
              except Exception as e:
                  raise RuntimeError('公式プロキシ応答解析失敗: ' + str(e) + ' body=' + text[:3000])

              page.close(); context.close(); browser.close()
          PY
          python /tmp/diag.py
