# Rakuten API browser-origin keyword comparison diagnostic
name: 楽天ブラウザブリッジ実接続診断
on:
  push:
    paths:
      - '.github/workflows/rakuten-bridge-live-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Playwrightで楽天API検索語別の実接続を診断
        env:
          HATENA_URL: https://kazuyuki0217.github.io/cookingauto/rakuten-test/
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          set -e
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          cat > /tmp/diag.py <<'PY'
          import json, os
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright

          page_url = os.environ['HATENA_URL']
          access_key = os.environ['RAKUTEN_ACCESS_KEY']
          api = 'https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20260701'
          keywords = ['フライパン', '包丁', '鍋', '保存容器']
          results = []

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context()
              page = context.new_page()
              page.goto(page_url, wait_until='domcontentloaded', timeout=60000)
              page.set_extra_http_headers({'Origin': 'https://kazuyuki0217.github.io', 'Referer': page_url})

              for keyword in keywords:
                  params = {
                      'applicationId':'5db6e350-5a71-4843-8dcf-894bef88df',
                      'accessKey':access_key,
                      'affiliateId':'56e8483c.b8c4995b.56e8483d.205a3086',
                      'keyword':keyword,
                      'hits':'3','page':'1','format':'json','formatVersion':'2',
                      'sort':'-reviewCount','orFlag':'1','availability':'1','imageFlag':'1'
                  }
                  api_url = api + '?' + urlencode(params)
                  captured = {}

                  def on_response(r):
                      if '/IchibaItem/Search/' not in r.url:
                          return
                      captured['status'] = r.status
                      captured['content_type'] = r.headers.get('content-type')
                      try:
                          captured['body'] = r.body().decode('utf-8', errors='replace')
                      except Exception as e:
                          captured['body_error'] = str(e)

                  def on_failed(r):
                      if '/IchibaItem/Search/' in r.url:
                          captured['failed'] = r.failure

                  page.on('response', on_response)
                  page.on('requestfailed', on_failed)
                  page.evaluate("""(url) => fetch(url, {method:'GET', mode:'no-cors', credentials:'omit', cache:'no-store'}).catch(()=>{})""", api_url)
                  page.wait_for_timeout(5000)
                  body = captured.get('body','')
                  item_count = None
                  first_name = None
                  if body:
                      try:
                          data = json.loads(body)
                          items = data.get('items') or data.get('Items') or []
                          item_count = len(items)
                          if items and isinstance(items[0], dict):
                              first_name = items[0].get('itemName')
                      except Exception:
                          pass
                  result = {'keyword': keyword, 'http': captured.get('status'), 'content_type': captured.get('content_type'), 'failure': captured.get('failed'), 'item_count': item_count, 'first_product_name': first_name}
                  results.append(result)
                  print('KEYWORD_RESULT=' + json.dumps(result, ensure_ascii=False))

                  page.remove_listener('response', on_response)
                  page.remove_listener('requestfailed', on_failed)

              page.close(); context.close(); browser.close()

          print('=== RAKUTEN_KEYWORD_COMPARISON ===')
          print('SUMMARY=' + json.dumps(results, ensure_ascii=False))
          PY
          python /tmp/diag.py
