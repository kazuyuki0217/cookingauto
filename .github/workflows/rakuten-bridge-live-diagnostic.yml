# Rakuten API browser-origin diagnostic: browser fetch with explicit Origin + Referer
name: 楽天ブラウザブリッジ実接続診断
on:
  push:
    paths:
      - '.github/workflows/rakuten-bridge-live-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Playwrightで楽天API実接続を診断
        env:
          HATENA_URL: https://tansinfuninkazu.hatenablog.com/
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          set -e
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          cat > /tmp/diag.py <<'PY'
          import json, os, re
          from urllib.parse import urlencode, urlparse
          from playwright.sync_api import sync_playwright

          hatena = os.environ['HATENA_URL']
          origin = '{uri.scheme}://{uri.netloc}'.format(uri=urlparse(hatena))
          access_key = os.environ['RAKUTEN_ACCESS_KEY']
          api = 'https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20260701'
          params = {
              'applicationId':'5db6e350-5a71-4843-8dcf-894bef88df',
              'accessKey':access_key,
              'affiliateId':'56e8483c.b8c4995b.56e8483d.205a3086',
              'keyword':'フライパン',
              'hits':'3',
              'page':'1',
              'format':'json',
              'formatVersion':'2',
              'sort':'-reviewCount',
              'orFlag':'1',
              'availability':'1',
              'imageFlag':'1'
          }
          api_url = api + '?' + urlencode(params)

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context()
              page = context.new_page()
              captured = {}

              def on_request(request):
                  if '/IchibaItem/Search/' in request.url:
                      captured['request_referer'] = request.headers.get('referer')
                      captured['request_origin'] = request.headers.get('origin')

              def on_response(response):
                  if '/IchibaItem/Search/' in response.url:
                      captured['status'] = response.status
                      captured['content_type'] = response.headers.get('content-type')
                      try:
                          captured['body'] = response.body().decode('utf-8', errors='replace')
                      except Exception as e:
                          captured['body_error'] = str(e)

              def route_handler(route):
                  headers = dict(route.request.headers)
                  headers['referer'] = hatena
                  headers['origin'] = origin
                  route.continue_(headers=headers)

              page.on('request', on_request)
              page.on('response', on_response)
              page.route('https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/**', route_handler)
              page.goto(hatena, wait_until='domcontentloaded', timeout=60000)
              print('=== TEST_REAL_HATENA_BROWSER_FETCH_EXPLICIT_ORIGIN_REFERER ===')

              result = page.evaluate("""async (url) => {
                try {
                  const r = await fetch(url, {method:'GET', credentials:'omit'});
                  return {ok:r.ok, status:r.status, type:r.type, text:await r.text()};
                } catch (e) {
                  return {fetch_error:String(e)};
                }
              }""", api_url)

              page.wait_for_timeout(2000)
              print('BROWSER_FETCH_RESULT=' + json.dumps(result, ensure_ascii=False)[:3000])
              print('NETWORK_STATUS=' + str(captured.get('status')))
              print('NETWORK_CONTENT_TYPE=' + str(captured.get('content_type')))
              print('NETWORK_REFERER_PRESENT=' + str(bool(captured.get('request_referer'))))
              print('NETWORK_ORIGIN_PRESENT=' + str(bool(captured.get('request_origin'))))
              print('NETWORK_BODY_HEAD=' + captured.get('body','')[:2000])
              page.close(); context.close(); browser.close()

          status = captured.get('status')
          body = captured.get('body','')
          if status != 200:
              raise RuntimeError('楽天APIブラウザ実接続 HTTPエラー: ' + str(status) + ' ' + body[:1000])

          if body.startswith('{'):
              data = json.loads(body)
          else:
              match = re.search(r'^[^(]+\((.*)\)\s*;?\s*$', body, re.S)
              if not match:
                  raise RuntimeError('楽天API応答をJSON/JSONPとして解析できませんでした: ' + body[:1000])
              data = json.loads(match.group(1))

          items = data.get('items') or data.get('Items') or []
          if not items:
              raise RuntimeError('楽天APIは200だが商品0件: ' + json.dumps(data, ensure_ascii=False)[:5000])
          print('RAKUTEN_CONNECTION_VERIFIED=' + json.dumps({'http':'200','product_count':len(items),'first_product_name':items[0].get('itemName') if isinstance(items[0],dict) else None}, ensure_ascii=False))
          PY
          python /tmp/diag.py
