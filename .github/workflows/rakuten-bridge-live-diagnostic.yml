# Rakuten API official test-form proxy diagnostic
name: 楽天API公式テストフォーム実接続診断
on:
  push:
    paths:
      - '.github/workflows/rakuten-bridge-live-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: 楽天公式プロキシの正規リクエスト条件を取得
        env:
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          set -e
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          cat > /tmp/diag.py <<'PY'
          import json, os
          from urllib.parse import urlsplit, parse_qs
          from playwright.sync_api import sync_playwright

          app_id = '5db6e350-5a71-4843-8dcf-894bef88df'
          access_key = os.environ['RAKUTEN_ACCESS_KEY']
          test_url = 'https://webservice.rakuten.co.jp/explorer/api/IchibaItem/Search'

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context()
              page = context.new_page()
              captured = {}

              def on_request(r):
                  if r.url.startswith('https://webservice.rakuten.co.jp/explorer/proxy'):
                      q = parse_qs(urlsplit(r.url).query)
                      captured['request'] = {
                          'method': r.method,
                          'query_keys': sorted(q.keys()),
                          'query_nonsecret': {k:v[:2] for k,v in q.items() if k.lower() != 'accesskey'},
                          'headers': {k:v for k,v in r.headers.items() if k.lower() in ('referer','origin','x-csrf-token','content-type','accept','x-requested-with')},
                          'has_cookie': bool(r.headers.get('cookie'))
                      }

              def on_response(r):
                  if r.url.startswith('https://webservice.rakuten.co.jp/explorer/proxy'):
                      captured['response_status'] = r.status
                      captured['response_type'] = r.headers.get('content-type')
                      try:
                          body = r.body().decode('utf-8', errors='replace')
                          captured['response_head'] = body[:1500]
                      except Exception:
                          pass

              page.on('request', on_request)
              page.on('response', on_response)
              page.goto(test_url, wait_until='domcontentloaded', timeout=60000)
              page.wait_for_timeout(2000)
              page.locator('#inputCredential').fill(app_id)
              page.locator('#accessKey').fill(access_key)
              page.locator('input[placeholder*="Keyword"]').first.fill('フライパン')
              page.locator('#btnExecute').click()
              page.wait_for_timeout(8000)

              print('=== RAKUTEN_OFFICIAL_PROXY_REQUEST ===')
              print('CAPTURED=' + json.dumps(captured, ensure_ascii=False))
              page.close(); context.close(); browser.close()

          if 'request' not in captured:
              raise RuntimeError('公式プロキシの正規リクエストを取得できませんでした')
          if captured.get('response_status') != 200:
              raise RuntimeError('公式プロキシ正規リクエストの応答失敗: ' + json.dumps(captured, ensure_ascii=False))
          print('RAKUTEN_PROXY_REQUEST_VERIFIED=' + json.dumps(captured, ensure_ascii=False))
          PY
          python /tmp/diag.py
