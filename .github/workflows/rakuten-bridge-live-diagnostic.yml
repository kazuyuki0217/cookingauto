# Rakuten API browser-origin diagnostic: actual Hatena page -> browser fetch
name: 楽天ブラウザブリッジ実接続診断
on:
  push:
    paths:
      - '.github/workflows/rakuten-bridge-live-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Playwrightで楽天API実接続を診断
        env:
          HATENA_URL: https://tansinfuninkazu.hatenablog.com/
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          set -e
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          cat > /tmp/diag.py <<'PY'
          import json, os
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright

          hatena = os.environ['HATENA_URL']
          access_key = os.environ['RAKUTEN_ACCESS_KEY']
          api = 'https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20260701'
          params = {'applicationId':'5db6e350-5a71-4843-8dcf-894bef88df','accessKey':access_key,'affiliateId':'56e8483c.b8c4995b.56e8483d.205a3086','keyword':'フライパン','hits':'3','page':'1','format':'json','formatVersion':'2'}
          api_url = api + '?' + urlencode(params)

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context()
              page = context.new_page()
              captured = {}

              def on_response(response):
                  if '/IchibaItem/Search/' in response.url:
                      captured['status'] = response.status
                      captured['url'] = response.url
                      captured['content_type'] = response.headers.get('content-type')
                      try:
                          captured['body'] = response.body().decode('utf-8', errors='replace')[:10000]
                      except Exception as e:
                          captured['body_error'] = str(e)

              page.on('response', on_response)
              print('=== TEST_REAL_HATENA_PAGE_BROWSER_FETCH ===')
              page.goto(hatena, wait_until='domcontentloaded', timeout=60000)
              result = page.evaluate("""async (url) => {
                try {
                  const r = await fetch(url, {method:'GET', credentials:'omit'});
                  return {ok:r.ok, status:r.status, type:r.type, redirected:r.redirected, url:r.url, text:await r.text()};
                } catch (e) {
                  return {fetch_error:String(e)};
                }
              }""", api_url)
              page.wait_for_timeout(3000)
              print('BROWSER_FETCH_RESULT=' + json.dumps(result, ensure_ascii=False)[:12000])
              print('RAKUTEN_NETWORK_CAPTURE=' + json.dumps(captured, ensure_ascii=False)[:12000])
              page.close(); context.close(); browser.close()

              body = captured.get('body','')
              status = captured.get('status')
              if status != 200:
                  raise RuntimeError('楽天APIブラウザ実接続 HTTPエラー: ' + str(status) + ' ' + body[:2000])
              try:
                  data = json.loads(body)
              except Exception:
                  raise RuntimeError('楽天APIブラウザ応答をJSON解析できませんでした: ' + body[:2000])
              items = data.get('items') or data.get('Items') or []
              if not items:
                  raise RuntimeError('楽天APIは200だが商品0件: ' + json.dumps(data, ensure_ascii=False)[:5000])
              print('RAKUTEN_CONNECTION_VERIFIED=' + json.dumps({'http':'200','product_count':len(items),'first_product_name':items[0].get('itemName') if isinstance(items[0],dict) else None}, ensure_ascii=False))
          PY
          python /tmp/diag.py
