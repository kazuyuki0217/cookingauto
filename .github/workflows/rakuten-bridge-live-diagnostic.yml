# Top-level API navigation + route.continueでHatena Refererを実際のHTTPリクエストへ付与
name: 楽天ブラウザブリッジ実接続診断
on:
  push:
    paths:
      - '.github/workflows/rakuten-bridge-live-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Playwrightで楽天API実接続を診断
        env:
          HATENA_URL: https://tansinfuninkazu.hatenablog.com/
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          set -e
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          cat > /tmp/diag.py <<'PY'
          import json, os
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright

          hatena = os.environ['HATENA_URL']
          access_key = os.environ['RAKUTEN_ACCESS_KEY']
          api = 'https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20260701'
          params = {'applicationId':'5db6e350-5a71-4843-8dcf-894bef88df','accessKey':access_key,'affiliateId':'56e8483c.b8c4995b.56e8483d.205a3086','keyword':'フライパン','hits':'3','page':'1','format':'json','formatVersion':'2'}
          api_url = api + '?' + urlencode(params)

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context()
              page = context.new_page()

              def keep_referrer(route):
                  headers = dict(route.request.headers)
                  headers['referer'] = hatena
                  route.continue_(headers=headers)

              page.route('**/IchibaItem/Search/**', keep_referrer)
              print('=== TEST TOP_LEVEL_NAVIGATION_ROUTE_CONTINUE_REFERER ===')
              response = page.goto(api_url, wait_until='domcontentloaded', timeout=60000)
              status = response.status if response else None
              body = response.text() if response else ''
              print('RAKUTEN_RESPONSE=' + json.dumps({'http':status,'url':page.url,'content_type':response.headers.get('content-type') if response else None,'body_head':body[:5000]}, ensure_ascii=False))
              page.close(); context.close(); browser.close()

              if status != 200:
                  raise RuntimeError('楽天API HTTPエラー: ' + str(status) + ' ' + body[:2000])
              try:
                  data = json.loads(body)
              except Exception:
                  raise RuntimeError('楽天API本文をJSON解析できませんでした: ' + body[:2000])
              items = data.get('items') or data.get('Items') or []
              if not items:
                  raise RuntimeError('楽天APIは200だが商品0件: ' + json.dumps(data, ensure_ascii=False)[:5000])
              print('RAKUTEN_CONNECTION_VERIFIED=' + json.dumps({'http':'200','product_count':len(items),'first_product':items[0]}, ensure_ascii=False)[:5000])
          PY
          python /tmp/diag.py
