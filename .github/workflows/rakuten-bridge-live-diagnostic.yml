# Rakuten API browser-origin diagnostic: JSONP script from Hatena-origin browser
name: 楽天ブラウザブリッジ実接続診断
on:
  push:
    paths:
      - '.github/workflows/rakuten-bridge-live-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Playwrightで楽天API実接続を診断
        env:
          HATENA_URL: https://tansinfuninkazu.hatenablog.com/
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          set -e
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          cat > /tmp/diag.py <<'PY'
          import json, os, re
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright

          hatena = os.environ['HATENA_URL']
          access_key = os.environ['RAKUTEN_ACCESS_KEY']
          api = 'https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20260701'
          callback = 'rakutenDiagnosticCallback'
          params = {
              'applicationId':'5db6e350-5a71-4843-8dcf-894bef88df',
              'accessKey':access_key,
              'affiliateId':'56e8483c.b8c4995b.56e8483d.205a3086',
              'keyword':'フライパン',
              'hits':'3',
              'page':'1',
              'format':'json',
              'formatVersion':'2',
              'sort':'-reviewCount',
              'orFlag':'1',
              'availability':'1',
              'imageFlag':'1',
              'callback':callback
          }
          api_url = api + '?' + urlencode(params)

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context()
              page = context.new_page()
              captured = {}
              page.on('response', lambda r: captured.update({'status': r.status, 'content_type': r.headers.get('content-type'), 'body': r.body().decode('utf-8', errors='replace')}) if '/IchibaItem/Search/' in r.url else None)
              page.goto(hatena, wait_until='domcontentloaded', timeout=60000)
              page.evaluate("""(url) => {
                window.__RAKUTEN_CALLBACK_DATA = null;
                window.rakutenDiagnosticCallback = (data) => { window.__RAKUTEN_CALLBACK_DATA = data; };
                const s = document.createElement('script');
                s.id = 'rakuten-diagnostic-jsonp';
                s.src = url;
                s.async = true;
                s.onerror = () => { window.__RAKUTEN_SCRIPT_ERROR = true; };
                document.head.appendChild(s);
              }""", api_url)
              try:
                  page.wait_for_function("window.__RAKUTEN_CALLBACK_DATA !== null || window.__RAKUTEN_SCRIPT_ERROR === true", timeout=30000)
              except Exception:
                  pass
              result = page.evaluate("({callback: window.__RAKUTEN_CALLBACK_DATA, scriptError: !!window.__RAKUTEN_SCRIPT_ERROR})")
              page.wait_for_timeout(1000)
              print('=== TEST_HATENA_BROWSER_JSONP ===')
              print('JSONP_CALLBACK=' + json.dumps(result.get('callback'), ensure_ascii=False)[:5000])
              print('JSONP_SCRIPT_ERROR=' + str(result.get('scriptError')))
              print('NETWORK_STATUS=' + str(captured.get('status')))
              print('NETWORK_CONTENT_TYPE=' + str(captured.get('content_type')))
              print('NETWORK_BODY_HEAD=' + captured.get('body','')[:2000])
              page.close(); context.close(); browser.close()

          data = result.get('callback')
          if not isinstance(data, dict):
              raise RuntimeError('楽天API JSONPコールバックを取得できませんでした: ' + json.dumps(result, ensure_ascii=False)[:3000])
          if data.get('error') or data.get('errors'):
              raise RuntimeError('楽天API JSONPエラー: ' + json.dumps(data, ensure_ascii=False)[:3000])
          items = data.get('items') or data.get('Items') or []
          if not items:
              raise RuntimeError('楽天API JSONPは成功したが商品0件: ' + json.dumps(data, ensure_ascii=False)[:5000])
          print('RAKUTEN_CONNECTION_VERIFIED=' + json.dumps({'http':str(captured.get('status')), 'product_count':len(items), 'first_product_name':items[0].get('itemName') if isinstance(items[0],dict) else None}, ensure_ascii=False))
          PY
          python /tmp/diag.py
