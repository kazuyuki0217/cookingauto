# Rakuten API official test-form diagnostic
name: 楽天API公式テストフォーム実接続診断
on:
  push:
    paths:
      - '.github/workflows/rakuten-bridge-live-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: 楽天公式APIテストフォームから実接続を確認
        env:
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          set -e
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          cat > /tmp/diag.py <<'PY'
          import json, os
          from playwright.sync_api import sync_playwright

          app_id = '5db6e350-5a71-4843-8dcf-894bef88df'
          access_key = os.environ['RAKUTEN_ACCESS_KEY']
          test_url = 'https://webservice.rakuten.co.jp/explorer/api/IchibaItem/Search'

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context()
              page = context.new_page()
              responses = []

              def on_response(r):
                  if 'openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/' in r.url:
                      item = {'status': r.status, 'content_type': r.headers.get('content-type')}
                      try:
                          body = r.body().decode('utf-8', errors='replace')
                          item['body_head'] = body[:4000]
                          try:
                              data = json.loads(body)
                              items = data.get('items') or data.get('Items') or []
                              item['item_count'] = len(items)
                              item['first_product_name'] = items[0].get('itemName') if items and isinstance(items[0], dict) else None
                              item['count'] = data.get('count')
                          except Exception:
                              pass
                      except Exception as e:
                          item['body_error'] = str(e)
                      responses.append(item)

              page.on('response', on_response)
              page.goto(test_url, wait_until='domcontentloaded', timeout=60000)

              # Fill the official form without printing the access key.
              page.locator('input').evaluate_all("""(els, values) => {
                  const app = els.find(e => /application|app.?id/i.test((e.name||'')+' '+(e.id||'')+' '+(e.placeholder||'')));
                  const key = els.find(e => /access.?key/i.test((e.name||'')+' '+(e.id||'')+' '+(e.placeholder||'')));
                  if (app) { app.value = values.app; app.dispatchEvent(new Event('input',{bubbles:true})); app.dispatchEvent(new Event('change',{bubbles:true})); }
                  if (key) { key.value = values.key; key.dispatchEvent(new Event('input',{bubbles:true})); key.dispatchEvent(new Event('change',{bubbles:true})); }
              }""", {'app': app_id, 'key': access_key})

              # Find keyword input and set フライパン.
              page.locator('input').evaluate_all("""(els) => {
                  const e = els.find(e => /keyword|キーワード|検索キーワード/i.test((e.name||'')+' '+(e.id||'')+' '+(e.placeholder||'')));
                  if (e) { e.value = 'フライパン'; e.dispatchEvent(new Event('input',{bubbles:true})); e.dispatchEvent(new Event('change',{bubbles:true})); }
              }""")

              # If the form exposes a GET button, click it. Otherwise submit the first form.
              clicked = page.locator('button, input[type=button], input[type=submit]').evaluate_all("""els => {
                  const e = els.find(e => /GET|送信|実行|Send/i.test((e.innerText||'')+' '+(e.value||'')));
                  if (e) { e.click(); return true; }
                  return false;
              }""")
              if not clicked:
                  page.locator('form').first.evaluate('(f) => f.submit()')

              page.wait_for_timeout(8000)
              print('=== RAKUTEN_OFFICIAL_TEST_FORM ===')
              print('PAGE_URL=' + page.url)
              print('API_RESPONSES=' + json.dumps(responses, ensure_ascii=False))

              page.close(); context.close(); browser.close()

          if not responses:
              raise RuntimeError('楽天公式テストフォームからIchibaItem/Searchのレスポンスを取得できませんでした')
          last = responses[-1]
          if last.get('status') != 200:
              raise RuntimeError('楽天公式テストフォームAPI HTTP失敗: ' + json.dumps({'http':last.get('status'),'content_type':last.get('content_type'),'body_head':last.get('body_head','')[:1000]}, ensure_ascii=False))
          if not last.get('item_count'):
              raise RuntimeError('楽天公式テストフォームAPIはHTTP 200だが商品0件: ' + json.dumps(last, ensure_ascii=False)[:3000])
          print('RAKUTEN_CONNECTION_VERIFIED=' + json.dumps({'http':last.get('status'),'product_count':last.get('item_count'),'first_product_name':last.get('first_product_name')}, ensure_ascii=False))
          PY
          python /tmp/diag.py
