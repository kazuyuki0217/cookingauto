name: 料理写真→収益化パイプライン

on:
  push:
    paths:
      - 'incoming/latest_photo.trigger'
  workflow_dispatch:
    inputs:
      image_file:
        description: '画像ファイル名（images/内）。空欄なら最新の画像を使用'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cooking-revenue-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v7

      - name: Pythonをセットアップ
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 必要なライブラリをインストール
        run: |
          pip install -r requirements.txt requests playwright
          python -m playwright install --with-deps chromium

      - name: 入力画像を確認
        env:
          INPUT_IMAGE: ${{ inputs.image_file }}
        run: |
          if [ -n "$INPUT_IMAGE" ]; then
            if [[ "$INPUT_IMAGE" == images/* ]]; then
              echo "COOKING_IMAGE_FILE=$INPUT_IMAGE" >> "$GITHUB_ENV"
            else
              echo "COOKING_IMAGE_FILE=images/$INPUT_IMAGE" >> "$GITHUB_ENV"
            fi
          else
            echo "COOKING_IMAGE_FILE=" >> "$GITHUB_ENV"
          fi

      - name: 料理名を受信データから読み込む
        run: |
          python - <<'PY'
          import base64, json
          from pathlib import Path
          p = Path("incoming/latest_photo.json")
          if not p.exists():
              raise SystemExit("incoming/latest_photo.json がありません。")
          raw = p.read_text(encoding="utf-8").strip()
          data = json.loads(base64.b64decode(raw).decode("utf-8"))
          dish = str(data.get("dishName", "")).strip()
          if not dish:
              raise SystemExit("incoming/latest_photo.json に料理名がありません。")
          Path("collection_dish_name.txt").write_text(dish, encoding="utf-8")
          print("受信料理名:", dish)
          PY
          echo "COLLECTION_DISH_NAME=$(cat collection_dish_name.txt)" >> "$GITHUB_ENV"

      - name: 料理写真を準備
        run: python upload_cooking_photo.py

      - name: はてなフォトライフへ画像を公開
        env:
          HATENA_ID: ${{ secrets.HATENA_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
          HATENA_FOTOLIFE_FOLDER: 料理アフィリエイト自動化
        run: python hatena_fotolife_upload.py

      - name: 無料Geminiで料理写真を解析して記事作成
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_article.py

      - name: 楽天アフィリエイト商品を組み込む
        env:
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_PAGES_URL: https://tansinfuninkazu.hatenablog.com/
          RAKUTEN_GAS_URL: https://script.google.com/macros/s/AKfycbw5WwonV2fI6FvHHZo3-PqkuPx0BH71qCsz_qkKFcVaiHzTzE80FGpvoEkeJbfQYzAL/exec
          PINTEREST_GAS_URL: https://script.google.com/macros/s/AKfycbw5WwonV2fI6FvHHZo3-PqkuPx0BH71qCsz_qkKFcVaiHzTzE80FGpvoEkeJbfQYzAL/exec
          PINTEREST_AUTOMATION_SECRET: ${{ secrets.PINTEREST_AUTOMATION_SECRET }}
        run: python article_affiliate_builder.py

      - name: はてなブログへ完成記事を投稿
        env:
          HATENA_ID: ${{ secrets.HATENA_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
          HATENA_ENDPOINT: ${{ secrets.HATENA_ENDPOINT }}
          POST_TITLE_FILE: article_title.txt
          POST_BODY_FILE: article_final.html
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          os.environ['POST_TITLE'] = Path(os.environ['POST_TITLE_FILE']).read_text(encoding='utf-8').strip()
          os.environ['POST_BODY'] = Path(os.environ['POST_BODY_FILE']).read_text(encoding='utf-8')
          import post_to_hatena
          PY

      - name: Pinterest用5パターンを生成
        run: python generate_pinterest_pins.py

      - name: Pinterestへ5件を自動投稿
        env:
          PINTEREST_GAS_URL: https://script.google.com/macros/s/AKfycbw5WwonV2fI6FvHHZo3-PqkuPx0BH71qCsz_qkKFcVaiHzTzE80FGpvoEkeJbfQYzAL/exec
          PINTEREST_AUTOMATION_SECRET: ${{ secrets.PINTEREST_AUTOMATION_SECRET }}
        run: python publish_pinterest_via_gas.py

      - name: 成果物を保存
        uses: actions/upload-artifact@v4
        with:
          name: cooking-revenue-pipeline
          path: |
            article_title.txt
            dish_name.txt
            article_body.txt
            article_final.html
            cooking_image_url.txt
            hatena_post_url.txt
            pinterest_pins.json
            pinterest_publish_result.json

      - name: Pinterest自動投稿完了確認
        run: echo 'Pinterestへ5件の実投稿まで完了しました。'
