name: 料理写真→収益化パイプライン

on:
  workflow_dispatch:
    inputs:
      image_file:
        description: '画像ファイル名（images/内）。空欄なら最新の画像を使用'
        required: false
        type: string
  push:
    paths:
      - 'images/**'
      - '.github/workflows/photo-to-revenue.yml'

permissions:
  contents: read

concurrency:
  group: cooking-revenue-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v7

      - name: Pythonをセットアップ
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 必要なライブラリをインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium

      - name: 入力画像を確認
        run: python scripts/check_input_image.py

      - name: 料理写真を準備
        run: python scripts/prepare_photo.py

      - name: はてなフォトライフへ画像を公開
        env:
          HATENA_ID: ${{ secrets.HATENA_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
        run: python scripts/upload_hatena_photo.py

      - name: 無料Geminiで料理写真を解析して記事作成
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python article_generator.py

      - name: 楽天アフィリエイト商品を組み込む
        env:
          RAKUTEN_PAGES_URL: https://kazuyuki0217.github.io/cookingauto/rakuten-test/
          RAKUTEN_GAS_URL: ${{ secrets.PINTEREST_GAS_URL }}
          RAKUTEN_AUTOMATION_SECRET: ${{ secrets.PINTEREST_AUTOMATION_SECRET }}
        run: python article_affiliate_builder.py

      - name: はてなブログへ完成記事を投稿
        env:
          HATENA_ID: ${{ secrets.HATENA_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
          HATENA_ENDPOINT: ${{ secrets.HATENA_ENDPOINT }}
        run: python publish_hatena.py

      - name: Pinterest用5パターンを生成
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python pinterest_content_generator.py

      - name: Pinterestへ5件を自動投稿
        env:
          PINTEREST_GAS_URL: ${{ secrets.PINTEREST_GAS_URL }}
          PINTEREST_AUTOMATION_SECRET: ${{ secrets.PINTEREST_AUTOMATION_SECRET }}
        run: python pinterest_publisher.py

      - name: 成果物を保存
        uses: actions/upload-artifact@v4
        with:
          name: cooking-revenue-pipeline
          path: |
            article_final.html
            pinterest_posts.json
            photo_ready.*
          if-no-files-found: warn

      - name: Pinterest自動投稿完了確認
        run: python scripts/verify_pinterest.py

# Rakuten browser-context header fix trigger: use the latest repository code.
