name: 楽天API Referrer明示診断

on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Rakuten API Referrer diagnostic
        env:
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          python - <<'PY'
          import os, json
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright

          access_key = os.environ.get("RAKUTEN_ACCESS_KEY", "").strip()
          if not access_key:
              raise RuntimeError("RAKUTEN_ACCESS_KEY が GitHub Actions Secrets に登録されていません")

          app_id = "5db6e350-5a71-4848-3d29-cf894bef88df"
          affiliate_id = "56e8483c.b8c4995b.56a8483d.205a3086"
          referrer = "https://tansinfuninkazu.hatenablog.com/"
          api_base = "https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20260701"

          params = {
              "applicationId": app_id,
              "accessKey": access_key,
              "affiliateId": affiliate_id,
              "keyword": "フライパン",
              "hits": "3",
              "page": "1",
              "format": "json",
              "formatVersion": "2",
          }
          api_url = api_base + "?" + urlencode(params)

          print("楽天API Referrer診断: 登録済みWebサイトを開きます")
          print("楽天API Referrer診断: 明示Referer付きHTTPリクエストを実行します")

          with sync_playwright() as p:
              browser = p.chromium.launch()
              context = browser.new_context(extra_http_headers={"Referer": referrer})
              page = context.new_page()
              page.goto(referrer, wait_until="domcontentloaded")

              response = context.request.get(
                  api_url,
                  headers={
                      "Referer": referrer,
                      "Origin": "https://tansinfuninkazu.hatenablog.com",
                      "Accept": "application/json,text/plain,*/*",
                  },
                  timeout=30000,
              )

              print(f"楽天API HTTP: {response.status}")
              print(f"楽天API Content-Type: {response.headers.get('content-type', '')}")
              print(f"楽天API Referrer送信値: {referrer}")

              body = response.text()
              if response.status < 200 or response.status >= 300:
                  print("楽天APIエラー本文:")
                  print(body[:2000])
                  raise RuntimeError(f"楽天API HTTPエラー: {response.status}")

              try:
                  data = json.loads(body)
              except Exception:
                  print(body[:2000])
                  raise RuntimeError("楽天APIレスポンスがJSONではありません")

              items = data.get("items", [])
              print(f"楽天API item数: {len(items)}")
              for i, item in enumerate(items[:3], 1):
                  info = item.get("item", item)
                  print(f"商品{i}: {info.get('itemName', '')}")
                  print(f"価格{i}: {info.get('itemPrice', '')}")
                  print(f"affiliateUrl{i}: {'あり' if info.get('affiliateUrl') else 'なし'}")

              if not items:
                  raise RuntimeError("楽天APIは200ですが商品が0件です")

              print("楽天API Referrer診断: SUCCESS")
              browser.close()
          PY
