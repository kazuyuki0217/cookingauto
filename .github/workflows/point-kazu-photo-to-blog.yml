name: Pointカズ｜料理写真→はてな記事投稿（第一段階）

on:
  push:
    paths:
      - 'incoming/latest_photo.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cooking-point-kazu-blog
  cancel-in-progress: false

jobs:
  point-kazu-blog:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4


      - name: 処理済み写真の二重投稿を防止
        env:
          PHOTO_TRIGGER: incoming/latest_photo.trigger
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          trigger = Path("incoming/latest_photo.trigger")
          if not trigger.exists():
              raise SystemExit("料理写真トリガーがありません。")
          text = trigger.read_text(encoding="utf-8")
          m = re.search(r"^photo=(.+)$", text, re.M)
          if not m:
              raise SystemExit("トリガーにphoto=がありません。")
          photo = m.group(1).strip()
          state = Path(".point-kazu-processed.txt")
          if state.exists() and photo in {x.strip() for x in state.read_text(encoding="utf-8").splitlines() if x.strip()}:
              raise SystemExit(f"既に処理済みの写真です: {photo}")
          print(f"今回処理する写真: {photo}")
          PY

      - name: 写真＋料理名メタデータを確定
        id: photo_meta
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("incoming/latest_photo.json")
          if not p.exists():
              raise SystemExit("料理写真メタデータがありません。")
          data=json.loads(p.read_text(encoding="utf-8"))
          photo=str(data.get("photoFile","")).strip()
          dish=str(data.get("dishName","")).strip()
          if not photo or not dish:
              raise SystemExit("写真ファイル名と料理名が揃っていません。")
          trigger=Path("incoming/latest_photo.trigger").read_text(encoding="utf-8")
          if photo not in trigger or dish not in trigger:
              raise SystemExit("写真と料理名の紐付けがトリガーと一致しません。")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("dish_name="+dish.replace("\n"," ").replace("\r"," ")+"\n")
          print("今回の料理名:", dish)
          print("今回の写真:", photo)
          PY

      - name: 料理写真を入力として確定
        run: |
          mkdir -p images
          if [ -s incoming/latest_photo.jpg ] && file incoming/latest_photo.jpg | grep -qi 'JPEG image data'; then
            cp incoming/latest_photo.jpg images/latest_photo.jpg
          elif [ -s incoming/latest_photo.b64 ]; then
            python - <<'PY'
          import base64, re
          from pathlib import Path
          raw_bytes = Path("incoming/latest_photo.b64").read_bytes()
          try:
              raw = raw_bytes.decode("utf-8").strip()
          except UnicodeDecodeError:
              Path("images/latest_photo.jpg").write_bytes(raw_bytes)
              print("latest_photo.b64 はJPEGバイナリでした。直接復元:", len(raw_bytes), "bytes")
          else:
              if raw.startswith("data:") and "," in raw:
                  raw = raw.split(",", 1)[1]
              raw = re.sub(r"[^A-Za-z0-9+/=_-]", "", raw)
              raw = raw.replace("-", "+").replace("_", "/")
              raw += "=" * ((4 - len(raw) % 4) % 4)
              data = base64.b64decode(raw, validate=False)
              if not data:
                  raise SystemExit("latest_photo.b64 が空です。")
              Path("images/latest_photo.jpg").write_bytes(data)
              print("latest_photo.b64 をBase64から復元しました:", len(data), "bytes")
          PY
          else
            echo 'Pointウェイブ：有効な料理写真が入力されていません。'
            exit 1
          fi
          file images/latest_photo.jpg
          test -s images/latest_photo.jpg

      - name: 必要なライブラリをインストール
        run: |
          pip install -r requirements.txt requests playwright
          python -m playwright install --with-deps chromium

      - name: 料理写真を準備
        env:
          COOKING_IMAGE_FILE: images/latest_photo.jpg
          COLLECTION_DISH_NAME: ${{ steps.photo_meta.outputs.dish_name }}
        run: python upload_cooking_photo.py

      - name: はてなフォトライフへ画像を公開
        env:
          HATENA_ID: ${{ secrets.HATENA_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
          HATENA_FOTOLIFE_FOLDER: 料理アフィリエイト自動化
        run: python hatena_fotolife_upload.py

      - name: Gemini写真解析→Claude風記事生成
        env:
          RAKUTEN_GAS_URL: https://script.google.com/macros/s/AKfycbw5WwonV2F6I6FvHHZo3-PqkuPx0BH71qCsz_qkKFcVaiHzTzE80FGpvoEkeJbfQYzAL/exec
          PINTEREST_AUTOMATION_SECRET: ${{ secrets.PINTEREST_AUTOMATION_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COOKING_IMAGE_FILE: images/latest_photo.jpg
          COLLECTION_DISH_NAME: ${{ steps.photo_meta.outputs.dish_name }}
        run: python cloud_article_client.py

      - name: 楽天アフィリエイトを心理設計で自然分散
        env:
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_PAGES_URL: https://tansinfuninkazu.hatenablog.com/
          RAKUTEN_GAS_URL: https://script.google.com/macros/s/AKfycbw5WwonV2F6I6FvHHZo3-PqkuPx0BH71qCsz_qkKFcVaiHzTzE80FGpvoEkeJbfQYzAL/exec
          PINTEREST_AUTOMATION_SECRET: ${{ secrets.PINTEREST_AUTOMATION_SECRET }}
        run: python article_affiliate_builder.py

      - name: はてなブログへ写真付き完成記事を自動投稿
        env:
          HATENA_ID: ${{ secrets.HATENA_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
          HATENA_ENDPOINT: ${{ secrets.HATENA_ENDPOINT }}
          POST_TITLE_FILE: article_title.txt
          POST_BODY_FILE: article_final.html
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          os.environ['POST_TITLE'] = Path(os.environ['POST_TITLE_FILE']).read_text(encoding='utf-8').strip()
          os.environ['POST_BODY'] = Path(os.environ['POST_BODY_FILE']).read_text(encoding='utf-8')
          import post_to_hatena
          PY

      - name: はてな投稿成功を確認
        run: |
          test -s article_final.html
          test -s hatena_post_url.txt
          echo "FIRST_STAGE_SUCCESS=true"
          echo "はてな投稿URL:"
          cat hatena_post_url.txt

      - name: 処理済み写真を記録
        run: |
          photo=$(sed -n 's/^photo=//p' incoming/latest_photo.trigger | head -n1)
          test -n "$photo"
          touch .point-kazu-processed.txt
          grep -Fxq "$photo" .point-kazu-processed.txt || echo "$photo" >> .point-kazu-processed.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .point-kazu-processed.txt
          git diff --cached --quiet || git commit -m "Pointウェイブ: 処理済み料理写真を記録"
          git push

      - name: 第一段階の成果物を保存
        uses: actions/upload-artifact@v4
        with:
          name: point-kazu-blog-${{ github.run_number }}
          path: |
            article_title.txt
            dish_name.txt
            article_body.txt
            article_final.html
            cooking_image_url.txt
            hatena_post_url.txt
