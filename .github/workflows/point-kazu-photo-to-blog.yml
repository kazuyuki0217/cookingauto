name: Pointカズ｜ここに貼った料理写真→ポイントウェイブ自動投稿

on:
  push:
    paths:
      - 'incoming/latest_photo.jpg'
      - 'incoming/latest_photo.b64'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cooking-point-kazu
  cancel-in-progress: false

jobs:
  point-kazu:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: 料理写真を入力として確定
        run: |
          mkdir -p images
          if [ -s incoming/latest_photo.jpg ] && file incoming/latest_photo.jpg | grep -qi 'JPEG image data'; then
            cp incoming/latest_photo.jpg images/latest_photo.jpg
          elif [ -s incoming/latest_photo.b64 ]; then
            python - <<'PY'
          import base64, re
          from pathlib import Path
          raw = Path("incoming/latest_photo.b64").read_text(encoding="utf-8").strip()
          if raw.startswith("data:") and "," in raw:
              raw = raw.split(",", 1)[1]
          raw = re.sub(r"[^A-Za-z0-9+/=_-]", "", raw)
          raw = raw.replace("-", "+").replace("_", "/")
          raw += "=" * ((4 - len(raw) % 4) % 4)
          data = base64.b64decode(raw, validate=False)
          if not data:
              raise SystemExit("latest_photo.b64 が空です。")
          Path("images/latest_photo.jpg").write_bytes(data)
          print("latest_photo.b64 を画像へ復元しました:", len(data), "bytes")
          PY
          else
            echo 'Pointウェイブ：有効な料理写真が入力されていません。'
            exit 1
          fi
          file images/latest_photo.jpg
          test -s images/latest_photo.jpg

      - name: 必要なライブラリをインストール
        run: |
          pip install -r requirements.txt requests playwright
          python -m playwright install --with-deps chromium

      - name: 料理写真を準備
        env:
          COOKING_IMAGE_FILE: images/latest_photo.jpg
        run: python upload_cooking_photo.py

      - name: はてなフォトライフへ画像を公開
        env:
          HATENA_ID: ${{ secrets.HATENA_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
          HATENA_FOTOLIFE_FOLDER: 料理アフィリエイト自動化
        run: python hatena_fotolife_upload.py

      - name: 写真解析・記事生成
        env:
          RAKUTEN_GAS_URL: https://script.google.com/macros/s/AKfycbyO9KgF5iFOVwbfrcqZzk5atwQTwkwjmKDtram8yecM2xfxjOGhWxpfUonnctUbx9M/exec
          PINTEREST_AUTOMATION_SECRET: ${{ secrets.PINTEREST_AUTOMATION_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COOKING_IMAGE_FILE: images/latest_photo.jpg
        run: python cloud_article_client.py

      - name: 楽天アフィリエイトを自動選別・クリック理由付きで挿入
        env:
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_PAGES_URL: https://tansinfuninkazu.hatenablog.com/
          RAKUTEN_GAS_URL: https://script.google.com/macros/s/AKfycbyO9KgF5iFOVwbfrcqZzk5atwQTwkwjmKDtram8yecM2xfxjOGhWxpfUonnctUbx9M/exec
          PINTEREST_AUTOMATION_SECRET: ${{ secrets.PINTEREST_AUTOMATION_SECRET }}
        run: python article_affiliate_builder.py

      - name: はてなブログへ写真付き完成記事を自動投稿
        env:
          HATENA_ID: ${{ secrets.HATENA_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
          HATENA_ENDPOINT: ${{ secrets.HATENA_ENDPOINT }}
          POST_TITLE_FILE: article_title.txt
          POST_BODY_FILE: article_final.html
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          os.environ['POST_TITLE'] = Path(os.environ['POST_TITLE_FILE']).read_text(encoding='utf-8').strip()
          os.environ['POST_BODY'] = Path(os.environ['POST_BODY_FILE']).read_text(encoding='utf-8')
          import post_to_hatena
          PY

      - name: Pinterest用5パターンを生成
        run: python generate_pinterest_pins.py

      - name: Pinterestへ5件を自動投稿
        env:
          PINTEREST_GAS_URL: https://script.google.com/macros/s/AKfycbw5WwonV2F6I6FvHHZo3-PqkuPx0BH71qCsz_qkKFcVaiHzTzE80FGpvoEkeJbfQYzAL/exec
          PINTEREST_AUTOMATION_SECRET: ${{ secrets.PINTEREST_AUTOMATION_SECRET }}
        run: python publish_pinterest_via_gas.py

      - name: 成果物を保存
        uses: actions/upload-artifact@v4
        with:
          name: point-kazu-wave-${{ github.run_number }}
          path: |
            article_title.txt
            dish_name.txt
            article_body.txt
            article_final.html
            cooking_image_url.txt
            hatena_post_url.txt
            pinterest_pins.json
            pinterest_publish_result.json

      - name: Pointウェイブ完了確認
        run: |
          test -s article_final.html
          test -s hatena_post_url.txt
          test -s pinterest_pins.json
          test -s pinterest_publish_result.json
          echo 'Pointウェイブ：料理写真→AI記事→楽天アフィリエイト→写真付きはてな→異なる5パターンPinterest投稿まで完了。'
