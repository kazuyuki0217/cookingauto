name: 楽天API単体接続診断

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rakuten-api-diagnostic.yml'
      - 'rakuten_browser_search.py'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v7

      - name: Pythonをセットアップ
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Playwrightをセットアップ
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: 楽天APIを直接診断
        env:
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.parse import quote, urlencode
          from playwright.sync_api import sync_playwright

          access_key = os.environ.get('RAKUTEN_ACCESS_KEY', '').strip()
          if not access_key:
              raise RuntimeError(
                  'RAKUTEN_ACCESS_KEY が GitHub Actions Secrets にありません。'
                  '楽天APIへ直接接続するため、この認証だけユーザー側で登録が必要です。'
              )

          api = 'https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20260701'
          site = 'https://tansinfuninkazu.hatenablog.com/'
          params = {
              'applicationId': '5db6e350-5a71-4843-8d29-cf894bef88df',
              'accessKey': access_key,
              'affiliateId': '56e8483c.b8c4995b.56a8483d.205a3086',
              'keyword': 'フライパン',
              'hits': '3',
              'page': '1',
              'format': 'json',
              'formatVersion': '2',
          }
          api_url = api + '?' + urlencode(params, quote_via=quote)

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context()
              page = context.new_page()
              try:
                  print('楽天API診断: 登録済みWebサイトを開きます')
                  page.goto(site, wait_until='domcontentloaded', timeout=30000)
                  print('楽天API診断: APIをトップレベル遷移します')
                  response = page.goto(api_url, wait_until='domcontentloaded', timeout=30000)
                  if response is None:
                      raise RuntimeError('楽天APIからレスポンスを取得できませんでした。')
                  status = response.status
                  content_type = response.headers.get('content-type', '')
                  body = response.text()
                  print('楽天API HTTP:', status)
                  print('楽天API Content-Type:', content_type)
                  print('楽天API URL:', api)
                  if status < 200 or status >= 300:
                      raise RuntimeError('楽天API HTTPエラー: ' + str(status) + ' body=' + body[:2000])
                  try:
                      data = json.loads(body)
                  except json.JSONDecodeError as exc:
                      raise RuntimeError('楽天API応答がJSONではありません: ' + body[:2000]) from exc

                  if data.get('error') or data.get('errors'):
                      raise RuntimeError('楽天APIがエラーを返しました: ' + json.dumps(data, ensure_ascii=False)[:2000])

                  items = data.get('Items') or data.get('items') or []
                  print('楽天API商品件数:', len(items))
                  if not items:
                      raise RuntimeError('楽天APIは正常応答しましたが商品が0件です。')

                  for i, raw in enumerate(items[:3], 1):
                      item = raw.get('Item', raw) if isinstance(raw, dict) else {}
                      print(f'商品{i}:', str(item.get('itemName', ''))[:120])
                      print(f'価格{i}:', item.get('itemPrice'))
                      print(f'アフィリエイトURL{i}:', 'あり' if item.get('affiliateUrl') else 'なし')

                  print('楽天API単体接続診断: 成功')
              finally:
                  context.close()
                  browser.close()
