name: 料理記事・楽天アフィリエイト統合テスト

on:
  workflow_dispatch:
    inputs:
      dish_name:
        description: 料理名
        required: false
        default: 豚の生姜焼き
      image_url:
        description: 公開済み料理写真URL（任意）
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 必要なライブラリをインストール
        run: pip install requests

      - name: テスト用記事素材を作成
        env:
          DISH_NAME: ${{ inputs.dish_name }}
          IMAGE_URL: ${{ inputs.image_url }}
        shell: bash
        run: |
          printf '%s\n' "仕事終わりに作る${DISH_NAME}。疲れていても、できるだけ手間を増やさずに自炊したい日に作りました。" > article_body.txt
          printf '%s\n' "51歳、単身赴任。仕事終わりに作る${DISH_NAME}" > article_title.txt
          echo "DISH_NAME=${DISH_NAME}"
          if [ -n "$IMAGE_URL" ]; then echo "COOKING_IMAGE_URL=${IMAGE_URL}"; else echo "COOKING_IMAGE_URL未設定（写真なしで商品連携を検証）"; fi

      - name: 楽天商品選定・完成記事生成
        env:
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          DISH_NAME: ${{ inputs.dish_name }}
          COOKING_IMAGE_URL: ${{ inputs.image_url }}
        run: python article_affiliate_builder.py

      - name: 完成記事を保存
        uses: actions/upload-artifact@v4
        with:
          name: article-final-html
          path: article_final.html
          if-no-files-found: error

      - name: 結果確認
        shell: bash
        run: |
          echo '--- 完成記事 ---'
          cat article_final.html
          echo
          echo '--- アフィリエイトURL件数 ---'
          grep -o 'hb\.afl\.rakuten\.co\.jp' article_final.html | wc -l
          echo '--- 写真タグ件数 ---'
          grep -o '<img ' article_final.html | wc -l
