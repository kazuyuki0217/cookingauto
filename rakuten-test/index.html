<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>楽天API接続テスト</title>
<style>body{font-family:system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 16px}input,button{font-size:16px;padding:10px;margin:6px 0;width:100%;box-sizing:border-box}pre{white-space:pre-wrap;word-break:break-word;background:#f5f5f5;padding:12px}</style>
</head>
<body>
<h1>楽天API接続テスト</h1>
<p>このページはWebアプリケーション方式の楽天API接続確認用です。</p>
<label>楽天アクセスキー</label>
<input id="key" type="password" autocomplete="off" placeholder="アクセスキーを入力">
<label>検索キーワード</label>
<input id="keyword" value="フライパン">
<button onclick="searchRakuten()">楽天APIをテスト</button>
<pre id="result">未実行</pre>
<script>
async function searchRakuten(){
 const result=document.getElementById('result');
 const key=document.getElementById('key').value.trim();
 const keyword=document.getElementById('keyword').value.trim()||'フライパン';
 if(!key){result.textContent='アクセスキーを入力してください。';return;}
 result.textContent='通信中...';
 const p=new URLSearchParams({applicationId:'5db6e350-5a71-4843-8d29-cf894bef88df',accessKey:key,affiliateId:'56e8483c.b8c4995b.56e8483d.205a3086',keyword:keyword,hits:'3',page:'1',format:'json',formatVersion:'2'});
 try{
  const r=await fetch('https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20260701?'+p.toString(),{method:'GET',headers:{'Accept':'application/json'}});
  const text=await r.text();
  result.textContent='HTTP '+r.status+'\n'+text;
 }catch(e){result.textContent='ブラウザ通信エラー\n'+e.message;}
}
</script>
</body>
</html>
