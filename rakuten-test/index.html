<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>楽天API接続テスト</title>
<style>body{font-family:system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 16px}input,button{font-size:16px;padding:10px;margin:6px 0;width:100%;box-sizing:border-box}pre{white-space:pre-wrap;word-break:break-word;background:#f5f5f5;padding:12px}</style>
</head>
<body>
<h1>楽天API接続テスト</h1>
<p>楽天公式APIをブラウザのJSONP方式で検索します。自動化時のアクセスキーは画面URLへ含めず、実行時だけメモリに渡されます。</p>
<label>楽天アクセスキー</label>
<input id="key" type="password" autocomplete="off" placeholder="アクセスキーを入力">
<label>検索キーワード</label>
<input id="keyword" value="フライパン">
<button onclick="searchRakuten()">楽天APIをテスト</button>
<pre id="result">未実行</pre>
<script>
let callbackName='';
let timeoutId=null;
window.__RAKUTEN_DONE=false;
window.__RAKUTEN_RESULT=null;

function cleanup(){
 if(timeoutId){clearTimeout(timeoutId);timeoutId=null;}
 if(callbackName){
  try{delete window[callbackName];}catch(e){window[callbackName]=undefined;}
  callbackName='';
 }
 const old=document.getElementById('rakuten-jsonp');
 if(old)old.remove();
}
function finish(data,message){
 window.__RAKUTEN_RESULT=data||null;
 window.__RAKUTEN_DONE=true;
 document.getElementById('result').textContent=message;
}
function searchRakuten(){
 cleanup();
 window.__RAKUTEN_DONE=false;
 window.__RAKUTEN_RESULT=null;
 const result=document.getElementById('result');
 const autoKey=window.__RAKUTEN_AUTOMATION_KEY||'';
 const key=(autoKey||document.getElementById('key').value).trim();
 const params=new URLSearchParams(location.search);
 const keyword=(params.get('keyword')||document.getElementById('keyword').value||'フライパン').trim()||'フライパン';
 const hits=window.__RAKUTEN_AUTOMATION_HITS||3;
 if(!key){result.textContent='アクセスキーを入力してください。';return;}
 result.textContent='楽天APIへ接続中...';
 callbackName='rakutenCallback_'+Date.now();
 window[callbackName]=function(data){
  const raw=JSON.stringify(data,null,2);
  cleanup();
  if(data&&data.error){finish(data,'楽天APIエラー\\n'+raw);return;}
  const items=data&&(data.Items||data.items);
  if(!items){finish(data,'楽天API応答形式エラー\\n'+raw);return;}
  finish(data,'楽天API接続成功\\n取得件数: '+items.length+'件');
 };
 const p=new URLSearchParams({
  applicationId:'5db6e350-5a71-4843-8d29-cf894bef88df',
  accessKey:key,
  affiliateId:'56e8483c.b8c4995b.56e8483d.205a3086',
  keyword:keyword,
  hits:String(hits),
  page:'1',
  format:'json',
  formatVersion:'2',
  callback:callbackName
 });
 const script=document.createElement('script');
 script.id='rakuten-jsonp';
 // Make the browser send the full GitHub Pages URL as the Referer.
 script.referrerPolicy='unsafe-url';
 script.src='https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20260701?'+p.toString();
 script.onload=function(){
  // A successful JSONP response calls the callback and sets __RAKUTEN_DONE.
  // If it does not, wait for the normal timeout so the caller gets a useful result.
 };
 script.onerror=function(){
  cleanup();
  finish(null,'楽天API通信エラー\\nJSONPリクエストを読み込めませんでした。呼び出し元: '+location.origin);
 };
 document.head.appendChild(script);
 timeoutId=setTimeout(function(){
  if(callbackName){
   cleanup();
   finish(null,'楽天APIタイムアウト\\n応答がありませんでした。');
  }
 },15000);
}

if(new URLSearchParams(location.search).get('mode')==='automation'){
 window.addEventListener('load',function(){searchRakuten();});
}
</script>
</body>
</html>
